# Run `uv run pre-commit install` once after cloning.
# Byte-rewriting hooks skip fixtures: they are byte-exact expected outputs.
---
default_language_version:
  python: python3

exclude: '^\.venv/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        # Invalid on purpose: the loader owes a field-level error for each.
        exclude: '^tests/packs/_negative/'
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: end-of-file-fixer
        exclude: '^(src/obelize/packs/.*/fixtures/|tests/fixtures/)'
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: '^(src/obelize/packs/.*/fixtures/|tests/fixtures/)'
      - id: detect-private-key
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '^(src/obelize/packs/.*/fixtures/|tests/fixtures/)'

  # Ruff runs from the project environment, so uv.lock is the one place its version is written.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types: [python]
        require_serial: true
        exclude: '^(src/obelize/packs/.*/fixtures/|tests/fixtures/)'
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types: [python]
        require_serial: true
        exclude: '^(src/obelize/packs/.*/fixtures/|tests/fixtures/)'

      # Fixture builders are code inside `tests/fixtures/`, which the hooks above treat as data.
      # One mypy hook per builder: two `_build.py` modules in one run are refused as duplicates.
      - id: fixture-builders-ruff
        name: ruff (fixture builders)
        entry: ruff check --no-force-exclude
        language: system
        files: '^tests/fixtures/.+/_build\.py$'
      - id: fixture-builders-ruff-format
        name: ruff format (fixture builders)
        entry: ruff format --check --no-force-exclude
        language: system
        files: '^tests/fixtures/.+/_build\.py$'
      - id: fixture-builder-encoding-mypy
        name: mypy (tests/fixtures/scan/encoding/_build.py)
        entry: mypy
        language: system
        files: '^tests/fixtures/scan/encoding/_build\.py$'
      - id: fixture-builder-walker-mypy
        name: mypy (tests/fixtures/walker/_build.py)
        entry: mypy
        language: system
        files: '^tests/fixtures/walker/_build\.py$'
