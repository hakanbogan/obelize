site_name: obelize
site_description: Verified codemods for breaking Python dependency upgrades.
site_url: https://hakanbogan.github.io/obelize/
repo_url: https://github.com/hakanbogan/obelize
repo_name: hakanbogan/obelize
edit_uri: edit/main/docs/
copyright: Apache License 2.0

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow

hooks:
  - mkdocs_hooks.py

# The ADRs are reached from Decisions; the other pages are in the navigation below.
nav:
  - Home: index.md
  - Getting started:
      - Getting started: GETTING_STARTED.md
      - After a run: AFTER_A_RUN.md
      - With a coding agent: WITH_A_CODING_AGENT.md
  - Reference:
      - Command line: CLI.md
      - Packs: PACKS.md
      - Pack format: PACK_SPEC.md
      - Scan vocabulary: SCAN_VOCABULARY.md
      - Run folder: RUN_FOLDER.md
      - Glossary: GLOSSARY.md
  - Trust:
      - Safety: SAFETY.md
      - Threat model: THREAT_MODEL.md
      - Privacy: PRIVACY.md
  - Project:
      - Limits: LIMITS.md
      - Known issues: KNOWN_ISSUES.md
      - Testing: TESTING.md
      - Benchmark: BENCHMARK.md
      - Benchmark results: BENCHMARK_RESULTS.md
      - Product boundary: PRODUCT.md
      - Roadmap: ROADMAP.md
      - Decisions: DECISIONS.md
      - Releasing: RELEASING.md
      - Changelog: CHANGELOG.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

# A link out of docs/ (to the README, the changelog or a source file) is checked by
# tests/unit/test_status_claims.py against the repository; the hook rewrites it for the site.
validation:
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
