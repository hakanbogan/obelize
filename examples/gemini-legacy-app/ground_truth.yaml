bindings:
  - file: summarizer/conversation.py
    kind: self_attr
    name: self.model
    scope: class:FollowUp
    ctor_line: 13
    use_lines: [14]
    verdict: needs_review
    bail: client_source_unresolved
    note: >-
      The binding resolves under D2 -- matched on the tuple (enclosing ClassDef `FollowUp`,
      first-parameter name `self`, attribute name `model`), never on the qualified-name string,
      which libcst renders as `FollowUp.__init__.<locals>.self.model`. It is closed-world: one
      constructor, one use, no escape. The `needs_review` comes from the module's missing
      `configure(...)` (`client_source_unresolved`), not from the binding.
      `scope` is the enclosing CLASS, not the method the assignment happens to sit in: D2 matches on
      the ClassDef node, and `__init__` is only the assignment site. This row said
      `method:FollowUp.__init__` before ADR-010, disagreeing with the identical binding kind in
      `../../tests/fixtures/scan/chat_async_self/ground_truth.yaml`.
  - file: summarizer/conversation.py
    kind: self_attr
    name: self.chat
    scope: class:FollowUp
    ctor_line: 14
    use_lines: [23, 28]
    verdict: needs_review
    bail: model_object_escapes
    note: >-
      The chat object gets the same treatment as the model object (ADR-006: "Chat objects use the
      same mechanism"), so it is a binding in its own right and was missing from this table
      entirely. It is NOT closed-world: line 28 reads `len(self.chat.history)`, an attribute read of
      the bound object rather than a receiver position, which is an escape. The group would
      therefore bail on `model_object_escapes` even if the module had a client. No verdict changes
      -- everything in this module is `needs_review` for `client_source_unresolved` anyway -- but
      the binding table is the authoritative record and it has to be complete.

must_not_report:
  - file: scripts/oneoff_backfill.py
    line: 11
    why: >-
      `.obelize.yml` excludes `scripts/**`. A scanner that ignores repository configuration reports
      four confident findings in this file (lines 11, 13, 15 and 19 -- an import, a `configure`, a
      constructor and a `generate_content`) and, worse, would rewrite a dead script that has no test
      to verify the result against. The exclusion is the case this file exists for.
  - file: scripts/oneoff_backfill.py
    line: 13
    why: Excluded by `.obelize.yml`; see line 11. This is also a second `configure(...)` in the repository, which must not be confused with the package's one -- D3's ClientSource is per module, not per repository, so it does not make `summarizer/config.py:22` a `multiple_configure_calls` bail.
  - file: scripts/oneoff_backfill.py
    line: 15
    why: Excluded by `.obelize.yml`; see line 11.
  - file: scripts/oneoff_backfill.py
    line: 19
    why: Excluded by `.obelize.yml`; see line 11.
  - file: summarizer/__init__.py
    line: 3
    why: >-
      The docstring names the distribution `google-generativeai` with a hyphen. It is not a module
      path and not an importable symbol, so it is not a `text_mention` of the legacy module; a
      scanner that matches the bare prefilter token `generativeai` in text rather than matching a
      dotted path will report it.
  - file: conftest.py
    line: 16
    why: >-
      `GEMINI_API_KEY` must survive the migration untouched: it is still a valid variable for
      google-genai, which reads `GOOGLE_API_KEY` first and `GEMINI_API_KEY` second (the precedence is
      inverted relative to legacy, C-20). The value is a dummy string, not a credential, and must not
      be reported as a leaked secret.
  - file: requirements.txt
    line: 6
    why: >-
      The comment above the unrelated pins spells the distribution name `google-generativeai`
      exactly, one line below the real declaration on line 3. `manifest_dependency` parses
      requirement lines; a substring, line-order or "first match wins" heuristic rewrites the
      comment too. `../../tests/fixtures/scan/basic/ground_truth.yaml` lists its unrelated pin for
      the same reason; this is the harder version, because the text is character-identical to the
      target.
  - file: README.md
    line: 6
    why: >-
      `README.md` is not matched by `include: "**/*.py"` and is never parsed, but it names
      `google-generativeai==0.8.6`, `google.generativeai` and `genai.configure` many times. A scanner
      that byte-prefilters before applying `include` will surface it.

notes: |
  RUN THE TESTS. Verified on 2026-09-17 in a throwaway venv (CPython 3.12.9, macOS arm64) built only
  from `requirements.txt`, never in the obelize project venv:

      python3 -m venv .venv && .venv/bin/pip install -r requirements.txt && .venv/bin/pytest -q
      -> 12 passed, 1 warning in 0.40s

  The one warning is google-generativeai 0.8.6's own `FutureWarning` about the package being
  unsupported. It is not filtered; it is the reason the app is here. The suite makes no network call,
  needs no API key, and takes well under a second, which is what `obelize verify` needs.

  `pytest.ini` exists so this app is its own pytest rootdir. Without it, pytest walks up out of
  `examples/` and adopts the obelize repository's `pyproject.toml` -- a different project with
  `testpaths`, `addopts` and `--strict-config` of its own -- so the app would behave one way in the
  repository and another way after being copied into a benchmark or e2e temp directory. It is a
  `pytest.ini` and not a `pyproject.toml` because the app is installed from `requirements.txt` and is
  not a distribution. Verified both ways: in place, and from a copy under a temp directory, the suite
  reports the same 12 passed.

  THE CLIENT SOURCE IS THE STORY. `configure()` is called in `summarizer/config.py` and nowhere else
  in the package. Under D3 that module is migrated, while `summarize.py` and `conversation.py` bail
  with `client_source_unresolved` and become `needs_review`. That is not a defect in the fixture: it
  is the corpus shape ADR-008 describes under "The honest one", and an end-to-end test that shows this
  app going fully automatic would be measuring something the rules do not claim.

  WHAT `obelize fix --apply` DOES TO THIS APP, since T54: nothing. The scan still grades the
  three rows below `auto` -- the import and the `configure` in `summarizer/config.py`, and one
  added line in `requirements.txt` -- and the run withholds all three. `summarize.py` and
  `conversation.py` stay on the legacy SDK with no `configure` of their own, so they run on
  `config.py`'s, and the codemod driver leaves that file alone under
  `configure_consumed_elsewhere` (ADR-031 D11); with nothing migrated, F-2 owes the manifest no new
  line. The run exits `4` with fourteen rows for a person and verifies nothing, because it wrote
  nothing. The three paragraphs below record what the run did before T54, and why that was wrong.

  WHAT `obelize fix --apply` DID TO THIS APP, after ADR-010 and until T54. Three edits: the import
  and the `configure` in `summarizer/config.py`, and one added line in `requirements.txt`.
  Everything else was left untouched -- `summarize.py`, `conversation.py`, and the legacy pin --
  with six withheld items in the report. The suite still passed: the migrated `config.py` no longer
  called `configure()`, but every test patches `google.generativeai.GenerativeModel` wholesale, so
  no real call is made, and the legacy package was still installed because its pin survived.
  `obelize verify` therefore reported `pass`.

  MEASURED, not reasoned. Those three edits were applied by hand to a copy of this app in a
  throwaway venv outside the repository (CPython 3.12, `uv pip install -r requirements.txt`), and
  the suite reported `12 passed, 1 warning in 1.41s`. The same experiment WITHOUT the added
  `google-genai` line reports three collection errors and
  `ImportError: cannot import name 'genai' from 'google'` -- which is how ADR-010's first draft of
  F-2, withholding the whole manifest edit, was caught. Also measured on the migrated module:
  `env -i python -c "import summarizer.config"` raises
  `ValueError: No API key was provided.` (the F-6 warning, live), and the same import with
  `GEMINI_API_KEY=dummy-key` set succeeds and builds a `Client`.

  That is a PARTIAL migration whose tests pass, and it must never be counted as a success. In
  docs/BENCHMARK.md's outcome tiers this is `partial`, never `verified_success`, and it is the
  concrete instance of the risk register's "tests pass but the application is semantically broken":
  at runtime the surviving legacy `GenerativeModel` in `summarize.py` now has no `configure()` behind
  it. The report says so; the green test suite does not. Under the fixture's ORIGINAL grading the
  same command rewrote all three imports and the manifest, and produced three collection errors.

  TESTS THE FULL MIGRATION WOULD INVALIDATE. None of these fire today, because the code they cover
  bails, but they are what a future C-31 or cross-module client would walk into, and they are the
  reason `obelize verify` is evidence rather than proof:

  - `tests/test_conversation.py:30` asserts `history[0]["parts"] == ["You are reviewing a summary I
    wrote."]`. The D4 rewrite of `conversation.py:14` turns that into `[{"text": "..."}]`, so proving
    D4 in this app breaks a currently green test.
  - `tests/test_summarize.py:35-36` assert the constructor received `generation_config` and
    `safety_settings` as dicts. After a full migration those arguments are gone: they live on
    `types.GenerateContentConfig` on the call.
  - `tests/test_conversation.py:55` (`turns()`) passes before AND after, because the chat object is a
    MagicMock -- while `conversation.py:28` is graded `unsupported`. A green suite hides it.

  THE TWO GAPS THIS FIXTURE FOUND, both now closed by ADR-010:

  1. No `confidence_reason` covered a manifest match, so this file left the field empty while
     `../../tests/fixtures/scan/basic/ground_truth.yaml` invented `manifest_declaration`. The closed
     sets are now in `docs/SCAN_VOCABULARY.md` (F-4) and the attested member is
     `manifest_dependency`, which the row above uses.
  2. ADR-008's C-20 limitation said the new `Client()` raises `ValueError` at construction "when
     neither variable is present". This app showed a second path: `configure(api_key=API_KEY)` where
     `API_KEY` is the empty string. Verified against google-genai 2.23.0: `genai.Client(api_key="")`
     raises `ValueError: No API key was provided.` while legacy `configure(api_key="")` returns
     quietly. F-6 widens the wording to "absent or empty" and attaches the warning
     `client_constructed_eagerly` to every `configure_to_client` edit.

  VERIFIED NEW-SDK FACTS used above, all measured on 2026-09-17 against google-genai 2.23.0 in a
  throwaway probe venv (nothing was installed into the project venv):

  - `google.genai.chats.Chat` public surface is exactly
    `['get_history', 'record_history', 'send_message', 'send_message_stream']`;
    `hasattr(Chat, "history")` is False.
  - `Chat.send_message(self, message, config=None)`; `Chats.create(*, model, config=None, history=None)`.
  - `types.GenerateContentResponse.text` exists and is a property.
  - `types.GenerateContentConfig` has `safety_settings` and `system_instruction`, and all three
    `generation_config` keys used here (`temperature`, `top_p`, `max_output_tokens`).
  - `HARM_CATEGORY_HARASSMENT` and `HARM_CATEGORY_HATE_SPEECH` are in
    `types.HarmCategory.__members__`; `BLOCK_ONLY_HIGH` and `BLOCK_MEDIUM_AND_ABOVE` are in
    `types.HarmBlockThreshold.__members__`. Membership, never construction (C-02).
  - `genai.Client(api_key="")` and `genai.Client()` with no key in the environment both raise
    `ValueError: No API key was provided.`

  No `expected.json` here on purpose: the Finding JSON schema does not exist until Phase 1 task T3.
  This file records the semantic facts; T3's harness translates them.
