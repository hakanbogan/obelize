case: gemini-legacy-app
after_file_is: none
what_it_exercises: >-
  A believable small application on google-generativeai 0.8.6 -- module-level `configure` in one
  module, a `GenerativeModel` with `generation_config`/`safety_settings`/`system_instruction` in
  another, a `self`-held model and a chat session in a third, `response.text`, mock patch targets in
  the test suite, a pinned manifest and one file excluded by `.obelize.yml` -- used as the end-to-end
  subject. Its tests mock the SDK boundary, so they run with no API key and no network.

findings:
  # ---- summarizer/config.py: the module that owns the client source ----
  - file: summarizer/config.py
    line: 9
    symbol: google.generativeai
    kind: import
    confidence_reason: alias_resolved
    verdict: auto
  - file: summarizer/config.py
    line: 22
    symbol: google.generativeai.configure
    kind: call
    confidence_reason: alias_resolved
    verdict: auto
    warnings: [client_constructed_eagerly]
    note: >-
      This is the module's -- and the package's -- only `configure(...)` call, so D3's module-wide
      ClientSource resolves here and only here. `api_key=` is an allowed kwarg and the value
      expression carries over verbatim, so the rewrite to `genai.Client(api_key=API_KEY)` is
      automatic. Recorded behaviour change, verified against google-genai 2.23.0 on 2026-09-17:
      `API_KEY` is `""` whenever `GEMINI_API_KEY` is unset (line 20), legacy `configure(api_key="")`
      returns without error, and `genai.Client(api_key="")` raises
      `ValueError: No API key was provided. Please pass a valid API key.` at construction. The test
      suite is unaffected because `conftest.py` sets the variable (a dummy key constructs fine --
      `Client(api_key="test-key-not-a-real-credential")` was confirmed to build), but
      `python -m summarizer.cli` with no key imports today and would raise after migration. ADR-010
      F-6 settles the verdict: `auto` with the mandatory warning `client_constructed_eagerly`, and
      C-20's limitation wording widens from "absent" to "absent or empty". Grading it
      `needs_review` would mean treating every non-literal `api_key=` expression as possibly empty,
      which is every real repository, for no safety gain in the common case.
      The scan grades this row `auto` and the run withholds it: `summarize.py` and
      `conversation.py` have no `configure` of their own and run on this one, so
      `obelize fix` leaves the file alone under `configure_consumed_elsewhere`
      (ADR-031 D11, T54). The warning stays on the withheld row.

