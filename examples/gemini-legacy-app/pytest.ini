# Standalone pytest configuration.
#
# It exists so this app is its own pytest rootdir. Without it, pytest walks up
# past examples/ and picks up the obelize repository's own pyproject.toml, which
# is a different project with different options -- and the app would behave one
# way inside this repository and another way after `obelize` copies it into a
# temporary directory for a benchmark case.
#
# It is a pytest.ini rather than a pyproject.toml on purpose: the app is
# installed with `pip install -r requirements.txt`, it is not a distribution.
[pytest]
minversion = 8.0
testpaths = tests
addopts = --strict-markers --strict-config
