# Declarative: rules pick registry kinds and supply params; `source.url` is never fetched.
# Measured on NumPy 1.26.4, 2.0.2, 2.3.5, 2.4.6 and 2.5.4 (SOURCES.md).
id: numpy/numpy-1-to-2
pack_version: 0.1.0
provider: numpy
language: python

source:
  type: official_guide
  url: https://numpy.org/doc/stable/numpy_2_0_migration_guide.html
  retrieved_at: 2026-10-27
  sha256: "ef9b0ac609c4a8401594abfe20f77c5e8b21d48cb5974db7705b4a0c3ddc84e7"

# One distribution on both sides. Every name the fixer writes exists in NumPy 1.x as well (the
# measurement), so the rewritten code runs on both and `from` states no floor: a requirement that
# admits NumPy 2 has nothing to move. NumPy 2.0 installs on Python 3.9 and later.
from:
  package: numpy
  version: "<2"
to:
  package: numpy
  version: ">=2"
  requires_python: ">=3.9"

match:
  # The module keeps its name, so only what 1.26.4 defined and NumPy 2 dropped or moved is legacy.
  imports:
    - numpy
  shared: true
  symbols:
    - numpy.ALLOW_THREADS
    - numpy.AxisError
    - numpy.BUFSIZE
    - numpy.CLIP
    - numpy.ComplexWarning
    - numpy.DataSource
    - numpy.ERR_CALL
    - numpy.ERR_DEFAULT
    - numpy.ERR_IGNORE
    - numpy.ERR_LOG
    - numpy.ERR_PRINT
    - numpy.ERR_RAISE
    - numpy.ERR_WARN
    - numpy.FLOATING_POINT_SUPPORT
    - numpy.FPE_DIVIDEBYZERO
    - numpy.FPE_INVALID
    - numpy.FPE_OVERFLOW
    - numpy.FPE_UNDERFLOW
    - numpy.Inf
    - numpy.Infinity
    - numpy.MAXDIMS
    - numpy.MAY_SHARE_BOUNDS
    - numpy.MAY_SHARE_EXACT
    - numpy.ModuleDeprecationWarning
    - numpy.NAN
    - numpy.NINF
    - numpy.NZERO
    - numpy.NaN
    - numpy.PINF
    - numpy.PZERO
    - numpy.RAISE
    - numpy.RankWarning
    - numpy.SHIFT_DIVIDEBYZERO
    - numpy.SHIFT_INVALID
    - numpy.SHIFT_OVERFLOW
    - numpy.SHIFT_UNDERFLOW
    - numpy.TooHardError
    - numpy.UFUNC_BUFSIZE_DEFAULT
    - numpy.UFUNC_PYVALS_NAME
    - numpy.VisibleDeprecationWarning
    - numpy.WRAP
    - numpy.add_docstring
    - numpy.add_newdoc
    - numpy.add_newdoc_ufunc
    - numpy.alltrue
    - numpy.asfarray
    - numpy.byte_bounds
    - numpy.cast
    - numpy.cfloat
    - numpy.chararray
    - numpy.clongfloat
    - numpy.compare_chararrays
    - numpy.compat
    - numpy.complex_
    - numpy.cumproduct
    - numpy.deprecate
    - numpy.deprecate_with_doc
    - numpy.disp
    - numpy.fastCopyAndTranspose
    - numpy.find_common_type
    - numpy.float_
    - numpy.format_parser
    - numpy.get_array_wrap
    - numpy.geterrobj
    - numpy.in1d
    - numpy.infty
    - numpy.issctype
    - numpy.issubclass_
    - numpy.issubsctype
    - numpy.longcomplex
    - numpy.longfloat
    - numpy.lookfor
    - numpy.mat
    - numpy.maximum_sctype
    - numpy.msort
    - numpy.nbytes
    - numpy.numarray
    - numpy.obj2sctype
    - numpy.oldnumeric
    - numpy.product
    - numpy.recfromcsv
    - numpy.recfromtxt
    - numpy.round_
    - numpy.row_stack
    - numpy.safe_eval
    - numpy.sctype2char
    - numpy.sctypes
    - numpy.set_numeric_ops
    - numpy.set_string_function
    - numpy.seterrobj
    - numpy.singlecomplex
    - numpy.sometrue
    - numpy.source
    - numpy.string_
    - numpy.tracemalloc_domain
    - numpy.trapz
    - numpy.unicode_
    - numpy.who
  # Any file that uses one of these names imports numpy, whatever it binds it as, so the name of the
  # module is the one token: a file that never spells it is skipped unparsed.
  prefilter_tokens:
    - numpy

changes:
  - id: ruff-npy201
    kind: external_fixer
    citation: "NumPy 2.0 migration guide, 'Ruff plugin' and 'Main namespace': the table of removed members; ruff, NPY201"
    params:
      fixer: ruff:NPY201
      symbols:
        - numpy.Inf
        - numpy.Infinity
        - numpy.NAN
        - numpy.NaN
        - numpy.PINF
        - numpy.alltrue
        - numpy.cfloat
        - numpy.clongfloat
        - numpy.complex_
        - numpy.cumproduct
        - numpy.float_
        - numpy.infty
        - numpy.longcomplex
        - numpy.longfloat
        - numpy.mat
        - numpy.product
        - numpy.round_
        - numpy.row_stack
        - numpy.safe_eval
        - numpy.singlecomplex
        - numpy.sometrue
        - numpy.string_
        - numpy.unicode_
    fixtures:
      - fixtures/negative/already_numpy2.py
      - fixtures/negative/not_numpy.py
      - fixtures/positive/aliases.before.py
      - fixtures/positive/constants.before.py
      - fixtures/positive/from_import.before.py
      - fixtures/positive/functions.before.py
      - fixtures/positive/mixed.before.py
      - fixtures/positive/safe_eval.before.py
      - fixtures/positive/silenced.before.py
      - fixtures/positive/strings.before.py

  - id: flag-moved-names
    kind: flag_only
    citation: "NumPy 2.0 migration guide, 'Main namespace': members that are still available elsewhere; NumPy 2.0.0 release notes: warnings and exceptions no longer exposed"
    params:
      symbols:
        - numpy.AxisError
        - numpy.ComplexWarning
        - numpy.DataSource
        - numpy.ModuleDeprecationWarning
        - numpy.RankWarning
        - numpy.TooHardError
        - numpy.VisibleDeprecationWarning
        - numpy.add_docstring
        - numpy.add_newdoc
        - numpy.byte_bounds
        - numpy.chararray
        - numpy.compare_chararrays
        - numpy.format_parser
        - numpy.tracemalloc_domain
      message: >-
        NumPy 2.0 took this name out of the main namespace, and for chararray
        NumPy 2.5 did; the object is still there, in a submodule.
      suggestion: >-
        The migration guide names where: np.lib for add_docstring, add_newdoc
        and tracemalloc_domain, np.lib.array_utils for byte_bounds, np.char for
        chararray and compare_chararrays, np.lib.npyio for DataSource, np.rec
        for format_parser, and np.exceptions for AxisError, ComplexWarning,
        ModuleDeprecationWarning, TooHardError and VisibleDeprecationWarning
        (NumPy 1.25 and later have it) and for RankWarning (NumPy 2 only).
        Move the reference by hand.
    fixtures:
      - fixtures/negative/already_numpy2.py
      - fixtures/positive/moved_names.before.py

  - id: flag-removed-names
    kind: flag_only
    citation: "NumPy 2.0 migration guide, 'Main namespace': the tables of removed and deprecated members; NumPy 2.0.0 and 2.4.0 release notes"
    params:
      symbols:
        - numpy.add_newdoc_ufunc
        - numpy.asfarray
        - numpy.cast
        - numpy.compat
        - numpy.deprecate
        - numpy.deprecate_with_doc
        - numpy.disp
        - numpy.fastCopyAndTranspose
        - numpy.find_common_type
        - numpy.get_array_wrap
        - numpy.geterrobj
        - numpy.in1d
        - numpy.issctype
        - numpy.issubclass_
        - numpy.issubsctype
        - numpy.lookfor
        - numpy.maximum_sctype
        - numpy.msort
        - numpy.nbytes
        - numpy.numarray
        - numpy.obj2sctype
        - numpy.oldnumeric
        - numpy.recfromcsv
        - numpy.recfromtxt
        - numpy.sctype2char
        - numpy.sctypes
        - numpy.set_numeric_ops
        - numpy.set_string_function
        - numpy.seterrobj
        - numpy.source
        - numpy.trapz
        - numpy.who
      message: >-
        NumPy 2.0 removed this name, or deprecated it (np.in1d, np.trapz) and a
        later release removed it, and what replaces it is not the same call.
      suggestion: >-
        Use the replacement the migration guide's tables give and check what it
        returns: np.isin(...).ravel() for np.in1d, np.trapezoid for np.trapz
        (NumPy 2 only), np.asarray with a float dtype for np.asfarray, np.sort(a,
        axis=0) for np.msort, the inspect module for source. numarray and
        oldnumeric have none. Port these call sites by hand.
    fixtures:
      - fixtures/negative/already_numpy2.py
      - fixtures/positive/removed_names.before.py

  - id: flag-internal-constants
    kind: flag_only
    citation: "NumPy 2.0 migration guide, 'Main namespace': the internal enums that were removed; NumPy 2.0.0 release notes: ERR_*, SHIFT_*"
    params:
      symbols:
        - numpy.ALLOW_THREADS
        - numpy.BUFSIZE
        - numpy.CLIP
        - numpy.ERR_CALL
        - numpy.ERR_DEFAULT
        - numpy.ERR_IGNORE
        - numpy.ERR_LOG
        - numpy.ERR_PRINT
        - numpy.ERR_RAISE
        - numpy.ERR_WARN
        - numpy.FLOATING_POINT_SUPPORT
        - numpy.FPE_DIVIDEBYZERO
        - numpy.FPE_INVALID
        - numpy.FPE_OVERFLOW
        - numpy.FPE_UNDERFLOW
        - numpy.MAXDIMS
        - numpy.MAY_SHARE_BOUNDS
        - numpy.MAY_SHARE_EXACT
        - numpy.RAISE
        - numpy.SHIFT_DIVIDEBYZERO
        - numpy.SHIFT_INVALID
        - numpy.SHIFT_OVERFLOW
        - numpy.SHIFT_UNDERFLOW
        - numpy.UFUNC_BUFSIZE_DEFAULT
        - numpy.UFUNC_PYVALS_NAME
        - numpy.WRAP
      message: >-
        NumPy 2.0 removed this internal constant from the main namespace and
        gives no replacement.
      suggestion: >-
        Port the call site by hand; for error handling see np.errstate, which
        replaces np.geterrobj and np.seterrobj.
    fixtures:
      - fixtures/negative/already_numpy2.py
      - fixtures/positive/internal_constants.before.py

  - id: flag-signed-constants
    kind: flag_only
    citation: "NumPy 2.0 migration guide, 'Main namespace': NINF, NZERO and PZERO; ruff, NPY201"
    params:
      symbols:
        - numpy.NINF
        - numpy.NZERO
        - numpy.PZERO
      message: >-
        NumPy 2.0 removed this constant. Its replacement is a signed literal
        (-np.inf, -0.0, 0.0) that binds looser than the name did, so a tool's
        textual rewrite changes `np.NINF ** 2` from inf to -inf.
      suggestion: >-
        Write -np.inf for NINF, -0.0 for NZERO and 0.0 for PZERO, inside
        parentheses where an operator or an attribute follows.
    fixtures:
      - fixtures/negative/already_numpy2.py
      - fixtures/positive/signed_constants.before.py

  - id: dependency
    kind: manifest_dependency
    citation: "NumPy 2.0 migration guide, the introduction and 'Ruff plugin'"
    params:
      from_name: numpy
      to_name: numpy
      to_spec: ">=2"
    fixtures:
      - fixtures/negative/requirements_already_new.txt
      - fixtures/positive/requirements.before.txt

verification:
  suggestions:
    - "<project python> -W error::DeprecationWarning -m pytest -q"

limitations:
  - "Only the 23 names under the external_fixer change are rewritten, by ruff (NPY201), in a release from 0.6.2 to 0.17.3 that obelize finds on your PATH and never installs. With none, or another release, every place stays as it was and its row says external_tool_missing or external_tool_version_unsupported; obelize pack validate prints the command that installs one."
  - "The tool runs on a file only when every place the scan found in it is one of those names, and its output is kept only if it changed no line the scan did not report, changes nothing when run again, and leaves none of the names. `from numpy import float_` is left standing (ruff adds the new name beside it), so such a file stays as it was; so does a line with `# noqa: NPY201`, which ruff honours (external_fix_incomplete)."
  - "Every other name of the main namespace that NumPy 1.26.4 has and 2.0.2 or 2.5.4 lacks (75) is reported, and any one holds the whole repository back: those that moved to a submodule, those whose replacement is not the same call (np.in1d keeps the shape of its input where np.isin(...).ravel() flattens it, np.trapezoid exists only on NumPy 2, np.source prints where inspect.getsource returns) and the internal constants, which have none."
  - "NINF, NZERO and PZERO are reported too: their replacement is a signed literal, which ruff writes without the parentheses np.NINF ** 2 needs (-np.inf ** 2 is -inf). np.in1d and np.trapz still exist in NumPy 2.0 to 2.3 and were removed in 2.4, np.row_stack and np.chararray in 2.5."
  - "A name written as a string is not found. np.dtype('float_'), dtype='complex_' and astype('string_') work on NumPy 1.26.4 and raise TypeError on 2.0 for bool8, bytes0, cfloat, clongfloat, complex_, float_, int0, longcomplex, longfloat, object0, singlecomplex, str0, string_, uint0, unicode_ and void0 (measured), and so does getattr(np, 'float_'). Search the code for those quoted names."
  - "Only names of the main namespace are looked at, not what numpy.lib, numpy.core or another submodule dropped. ruff also rewrites np.DTypePromotionError and np.INF, which no NumPy 1 defines, and the reported exceptions (np.AxisError and four more) to an import from numpy.exceptions, which NumPy 1.24 lacks; the pack claims none, so a file with one beside a rewritten name stays as it was (external_fix_out_of_scope)."
  - "Only names are looked at. NumPy 2 also changes how scalars and arrays are promoted (NEP 50: np.float32(3) + 3. is a float32), the default integer on Windows, the copy keyword of np.array, and the C API and ABI of every extension built against it. The tests are the check, and a package that links NumPy (pandas, SciPy, Matplotlib, your own extension) must ship a build for NumPy 2 before the pin can move."
  - "A name reached other than as an attribute or an import of numpy (a string given to eval, a star import, numpy.core, a module that re-exports numpy) is not rewritten. A patch target or a stub of numpy in sys.modules is not seen at all."
  - "The pin moves to numpy>=2 only when no place in the repository is withheld, and only in a requirement that excludes NumPy 2 (numpy==1.26.4, numpy<2). One that admits it (numpy>=1.22,<3) stays as written, which is what a library that still supports NumPy 1 wants; one with an environment marker, or a version nobody can read, is reported and holds the repository back. A lock file is not edited and may still pin NumPy 1."
  - "It moves the numpy line alone: the other pins of the file (pandas==1.5.3, scipy==1.10.1) are not judged, so install the result before you trust it. obelize upgrade numpy --apply does that in a copy and runs your tests. A repository that declares a Python below 3.9, which NumPy 2.0 does not install on, is blocked."
  - "No Gate 1 measurement exists: how many repositories use these names, and for how many the pack writes every use, has not been counted."
