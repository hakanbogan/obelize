# Declarative: rules pick registry kinds and supply params; `source.url` is never fetched.
# Measured on openai 0.28.1, 1.109.1 and 3.26.0 (SOURCES.md).
id: openai/openai-0-to-1
pack_version: 0.1.0
provider: openai
language: python

source:
  type: official_guide
  url: https://github.com/openai/openai-python/discussions/742
  retrieved_at: 2026-10-07
  sha256: "01b9c5d6dee28dfe95e8f8844fbddc3064e92941ab18bfed921e4e13cc294830"

# One distribution on both sides: 0.28.1 is the only 0.x measured, and 1.0 to 1.50 do not run on
# the httpx a fresh install resolves, so the target starts at the first release that does.
from:
  package: openai
  version: ">=0.28.1,<1"
to:
  package: openai
  version: ">=1.109.1"
  requires_python: ">=3.8"

match:
  # The module keeps its name, so only what 0.28.1 defined and the new releases dropped or
  # changed is legacy; `import openai`, `openai.OpenAI`, `openai.api_key` and the rest are not.
  imports:
    - openai
  shared: true
  symbols:
    - openai.Audio
    - openai.ChatCompletion
    - openai.Completion
    - openai.Customer
    - openai.Deployment
    - openai.Edit
    - openai.Embedding
    - openai.Engine
    - openai.ErrorObject
    - openai.File
    - openai.FineTune
    - openai.FineTuningJob
    - openai.Image
    - openai.InvalidRequestError
    - openai.Model
    - openai.Moderation
    - openai.aiosession
    - openai.api_base
    - openai.api_key_path
    - openai.api_requestor
    - openai.api_resources
    - openai.api_type
    - openai.api_version
    - openai.app_info
    - openai.ca_bundle_path
    - openai.cli
    - openai.datalib
    - openai.debug
    - openai.embeddings_utils
    - openai.enable_telemetry
    - openai.error
    - openai.log
    - openai.object_classes
    - openai.openai_object
    - openai.openai_response
    - openai.proxy
    - openai.requestssession
    - openai.upload_progress
    - openai.util
    - openai.validators
    - openai.verify_ssl_certs
    - openai.wandb_logger
  prefilter_tokens:
    - openai
  # Installed by 0.28.1 and absent from at least one release it migrates to (1.109.1 and 3.26.0
  # measured): its own requests and aiohttp, and what those two bring.
  transitive:
    aiohttp: aiohttp
    aiosignal: aiosignal
    attr: attrs
    attrs: attrs
    certifi: certifi
    charset_normalizer: charset-normalizer
    frozenlist: frozenlist
    multidict: multidict
    requests: requests
    tqdm: tqdm
    urllib3: urllib3
    yarl: yarl

changes:
  - id: chat-completion
    kind: rewrite_call
    citation: "openai-python v1.0.0 Migration Guide, 'Module client'"
    params:
      legacy_symbol: openai.ChatCompletion.create
      new_call: chat.completions.create
      root: module
      # The body parameters 0.28.1 sent untouched and every measured release still takes; the
      # ones that were routing or transport (engine, api_key, request_timeout, stream) are not here.
      keywords:
        - frequency_penalty
        - function_call
        - functions
        - logit_bias
        - logprobs
        - max_tokens
        - messages
        - model
        - n
        - presence_penalty
        - response_format
        - seed
        - stop
        - temperature
        - tool_choice
        - tools
        - top_logprobs
        - top_p
        - user
      result_paths:
        - choices[].finish_reason
        - choices[].index
        - choices[].message.content
        - choices[].message.role
        - created
        - id
        - model
        - usage.completion_tokens
        - usage.prompt_tokens
        - usage.total_tokens
    fixtures:
      - fixtures/negative/module_client_new.py
      - fixtures/positive/chat_completion.before.py
      - fixtures/positive/from_import.before.py
      - fixtures/positive/import_alias.before.py
      - fixtures/positive/response_shapes.before.py
      - fixtures/positive/unsupported_arguments.before.py

  - id: completion
    kind: rewrite_call
    citation: "openai-python v1.0.0 Migration Guide, 'Module client'"
    params:
      legacy_symbol: openai.Completion.create
      new_call: completions.create
      root: module
      keywords:
        - best_of
        - echo
        - frequency_penalty
        - logit_bias
        - logprobs
        - max_tokens
        - model
        - n
        - presence_penalty
        - prompt
        - seed
        - stop
        - suffix
        - temperature
        - top_p
        - user
      result_paths:
        - choices[].finish_reason
        - choices[].index
        - choices[].text
        - created
        - id
        - model
        - usage.completion_tokens
        - usage.prompt_tokens
        - usage.total_tokens
    fixtures:
      - fixtures/negative/module_client_new.py
      - fixtures/positive/completion.before.py

  - id: embedding
    kind: rewrite_call
    citation: "openai-python v1.0.0 Migration Guide, 'Module client'"
    params:
      legacy_symbol: openai.Embedding.create
      new_call: embeddings.create
      root: module
      # Not encoding_format: 0.28.1 asked for base64 itself and decoded it with numpy.
      keywords:
        - input
        - model
        - user
      result_paths:
        - data[].embedding
        - data[].index
        - model
        - usage.prompt_tokens
        - usage.total_tokens
    fixtures:
      - fixtures/negative/already_new.py
      - fixtures/positive/embedding.before.py

  - id: flag-async-calls
    kind: flag_only
    citation: "openai-python v1.0.0 Migration Guide, 'Async client'"
    params:
      symbols:
        - openai.ChatCompletion.acreate
        - openai.Completion.acreate
        - openai.Embedding.acreate
      message: >-
        0.28.1 awaited these on the module. The new module client has no async
        form: an awaited call needs openai.AsyncOpenAI, which is a client the
        file must build and own.
      suggestion: >-
        Build an AsyncOpenAI client where the application starts, and await
        client.chat.completions.create (or completions, embeddings) on it.
    fixtures:
      - fixtures/negative/already_new.py
      - fixtures/positive/async_calls.before.py

  - id: flag-settings
    kind: flag_only
    citation: "openai-python v1.0.0 Migration Guide, 'Module client'"
    params:
      symbols:
        - openai.aiosession
        - openai.api_base
        - openai.api_key_path
        - openai.api_type
        - openai.api_version
        - openai.app_info
        - openai.ca_bundle_path
        - openai.debug
        - openai.enable_telemetry
        - openai.log
        - openai.proxy
        - openai.requestssession
        - openai.verify_ssl_certs
      message: >-
        0.28.1 read this module setting. The new releases either do not define
        it, so assigning it succeeds and changes nothing, or read it
        differently (api_type and api_version select an Azure client, once,
        when the first call builds it).
      suggestion: >-
        Build an openai.OpenAI(...) client with base_url, http_client or the
        Azure arguments instead, and call that, or set the new equivalent
        (base_url, default_headers) on the module before its first call.
    fixtures:
      - fixtures/negative/module_client_new.py
      - fixtures/positive/settings.before.py

  - id: flag-errors
    kind: flag_only
    citation: "openai-python v1.0.0 Migration Guide, 'All name changes'"
    params:
      symbols:
        - openai.InvalidRequestError
        - openai.error
      message: >-
        The 0.28.1 exception classes were renamed, and a handler for a name that
        is gone fails or never runs. The classes of the new releases carry other
        attributes: status_code and body where the old ones had http_status and
        json_body.
      suggestion: >-
        Catch openai.OpenAIError, or the status classes of the new release
        (BadRequestError, RateLimitError, APITimeoutError), and read
        status_code instead of http_status.
    fixtures:
      - fixtures/negative/already_new.py
      - fixtures/positive/error_handlers.before.py

  - id: flag-resources
    kind: flag_only
    citation: "openai-python v1.0.0 Migration Guide, 'All name changes'"
    params:
      symbols:
        - openai.Audio
        - openai.Customer
        - openai.Deployment
        - openai.Edit
        - openai.Engine
        - openai.ErrorObject
        - openai.File
        - openai.FineTune
        - openai.FineTuningJob
        - openai.Image
        - openai.Model
        - openai.Moderation
      message: >-
        This pack does not rewrite this 0.28.1 resource. In the new releases
        the name is a stub that raises when called, and several of these
        endpoints (edits, fine-tunes) were shut down.
      suggestion: >-
        Port these call sites by hand: they become client.audio, client.files,
        client.images, client.models, client.moderations and
        client.fine_tuning.jobs, with keyword-only arguments and typed results.
    fixtures:
      - fixtures/negative/already_new.py
      - fixtures/positive/resources.before.py

  - id: flag-removed-modules
    kind: flag_only
    citation: "openai-python v1.0.0 Migration Guide, 'Removed'"
    params:
      symbols:
        - openai.api_requestor
        - openai.api_resources
        - openai.cli
        - openai.datalib
        - openai.embeddings_utils
        - openai.object_classes
        - openai.openai_object
        - openai.openai_response
        - openai.upload_progress
        - openai.util
        - openai.validators
        - openai.wandb_logger
      message: >-
        This module belongs to the 0.28.1 package. The new releases do not ship
        it, or ship another module under the name, so an import of it fails or
        reads something else once the pin moves.
      suggestion: >-
        Replace what the file takes from it with the new client and its typed
        results by hand.
    fixtures:
      - fixtures/negative/already_new.py
      - fixtures/positive/removed_modules.before.py

  - id: flag-indirect-use
    kind: flag_only
    citation: "openai-python v1.0.0 Migration Guide, 'Module client'"
    params:
      # Shape ids, never regexes: a pack carries nothing that drives behaviour.
      patterns:
        - dynamic_access
        - mock_patch_target
        - sys_modules_stub
      message: >-
        A legacy name is reached here as a string or through a dynamic import
        rather than by an import statement, so the rewrite cannot follow it. A
        patch target left on the old name keeps passing and stops testing
        anything.
      suggestion: >-
        Update the target by hand once the code it patches has moved to the new
        client.
    fixtures:
      - fixtures/negative/module_client_new.py
      - fixtures/positive/mock_patch_target.before.py

  - id: dependency
    kind: manifest_dependency
    citation: "openai-python v1.0.0 Migration Guide, 'Getting started'"
    params:
      from_name: openai
      to_name: openai
      to_spec: ">=1.109.1"
    fixtures:
      - fixtures/negative/requirements_already_new.txt
      - fixtures/positive/requirements.before.txt

verification:
  suggestions:
    - "pytest -q"

limitations:
  - "Only openai.ChatCompletion.create, openai.Completion.create and openai.Embedding.create are rewritten, and only to the same call on the module (openai.chat.completions.create): no client object is built, so openai.api_key and openai.organization keep working as they did."
  - "A result is rewritten only when every read of it is an attribute path the pack lists, such as response.choices[0].message.content. response[\"choices\"], response.get, a loop over a result and a result handed to another function withhold the file, because 0.28.1 results are dictionaries and the new ones are not."
  - "A call is refused unless every argument is a keyword the pack lists: positional arguments, stream, engine, deployment_id, request_timeout, timeout, api_key, api_base and a ** splat are not carried, since the new methods lack them or read them differently."
  - "Azure (api_type, api_version, engine, deployment_id) and every setting with no counterpart in the new releases are reported, never rewritten: assigning them still succeeds and changes nothing."
  - "Async calls, the other resources (Audio, Image, File, Moderation, FineTune and the rest), the openai.error classes and the modules of the 0.28.1 package are reported, never rewritten. The top-level openai.APIError exists on both sides and is not reported, since code already on the new release uses it: a handler for it that reads http_status, json_body or user_message fails with AttributeError once the pin moves."
  - "The distribution is one, so the pin moves with the code or not at all: when any row of the repository is withheld, every file is left as it was and the pin stays (repo_not_fully_migrated)."
  - "A module that 0.28.1 installed and a release it migrates to does not (requests, aiohttp, urllib3, certifi, tqdm and the rest of what those two bring: see match.transitive), imported by a file while no manifest of the repository declares it, holds the repository until one does. Any manifest counts, not the one that governs the file."
  - "0.28.1 read OPENAI_API_BASE and OPENAI_ORGANIZATION from the environment, and the new releases read OPENAI_BASE_URL and OPENAI_ORG_ID, so a gateway or an organization set only there is lost without an error once the pin moves. Rename them where they are set: the code is not asked."
  - "A file obelize does not read holds nothing: one over the size limit, one it cannot open, a notebook under a narrower include, a script with no .py name. The pin moves beside it, and the report lists the file."
  - "A repository that does not declare openai at 0.28.1 or above is blocked, and so is one that uses it and declares it nowhere obelize reads: the rules were measured on 0.28.1 only."
  - "A repository whose pyproject.toml or setup.cfg declares a Python below 3.8 is blocked. A Python declared only in setup.py or a Pipfile is not read."
  - "A requirement the pack cannot rewrite in place, openai[datalib] with extras for one, holds the whole repository (manifest_pin_shape_unsupported): edit that line by hand and run again."
  - "A declaration that already pins openai at 1.109.1 or above (openai==3.26.0, openai>=2) is left as written, and the code is still rewritten; one that admits an older release, openai>=0.28.1,<3 or openai>=1.0, is rewritten to openai>=1.109.1."
  - "A result bound to a module name that another module imports is read in this file only."
  - "Dynamic access, star imports and mock patch targets are reported, never rewritten. A patch target is seen only when it starts at openai: one written against your own module, as in myapp.llm.openai.ChatCompletion.create, is not."
  - "The module is followed inside one file. A name another of your modules re-exports (from mylib import openai) and a client built elsewhere are not seen."
  - "A file whose round trip through the parser is not byte-identical is reported and never edited."
