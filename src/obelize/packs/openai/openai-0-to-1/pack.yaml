# Declarative: rules pick registry kinds and supply params; `source.url` is never fetched.
# Measured on openai 0.27.0 to 0.28.1, 1.109.1 and 3.26.0 (SOURCES.md).
id: openai/openai-0-to-1
pack_version: 0.2.0
provider: openai
language: python

source:
  type: official_guide
  url: https://github.com/openai/openai-python/discussions/742
  retrieved_at: 2026-10-07
  sha256: "01b9c5d6dee28dfe95e8f8844fbddc3064e92941ab18bfed921e4e13cc294830"

# One distribution on both sides: 0.27.0, where ChatCompletion starts, to 0.28.1 were measured to
# have one surface, and 1.0 to 1.50 do not run on the httpx a fresh install resolves, so the target
# starts at the first release that does.
from:
  package: openai
  version: ">=0.27.0,<1"
to:
  package: openai
  version: ">=1.109.1"
  requires_python: ">=3.8"

match:
  # The module keeps its name, so only what 0.28.1 defined and the new releases dropped or
  # changed is legacy; `import openai`, `openai.OpenAI`, `openai.api_key` and the rest are not.
  imports:
    - openai
  shared: true
  symbols:
    - openai.Audio
    - openai.ChatCompletion
    - openai.Completion
    - openai.Customer
    - openai.Deployment
    - openai.Edit
    - openai.Embedding
    - openai.Engine
    - openai.ErrorObject
    - openai.File
    - openai.FineTune
    - openai.FineTuningJob
    - openai.Image
    - openai.InvalidRequestError
    - openai.Model
    - openai.Moderation
    - openai.aiosession
    - openai.api_base
    - openai.api_key_path
    - openai.api_requestor
    - openai.api_resources
    - openai.api_type
    - openai.api_version
    - openai.app_info
    - openai.ca_bundle_path
    - openai.cli
    - openai.datalib
    - openai.debug
    - openai.embeddings_utils
    - openai.enable_telemetry
    - openai.error
    - openai.log
    - openai.object_classes
    - openai.openai_object
    - openai.openai_response
    - openai.proxy
    - openai.requestssession
    - openai.upload_progress
    - openai.util
    - openai.validators
    - openai.verify_ssl_certs
    - openai.wandb_logger
  prefilter_tokens:
    - openai
  # Installed by 0.28.1 and absent from at least one release it migrates to (1.109.1 and 3.26.0
  # measured): its own requests and aiohttp, and what those two bring.
  transitive:
    aiohttp: aiohttp
    aiosignal: aiosignal
    attr: attrs
    attrs: attrs
    certifi: certifi
    charset_normalizer: charset-normalizer
    frozenlist: frozenlist
    multidict: multidict
    requests: requests
    tqdm: tqdm
    urllib3: urllib3
    yarl: yarl

changes:
  - id: chat-completion
    kind: rewrite_call
    citation: "openai-python v1.0.0 Migration Guide, 'Module client'"
    params:
      legacy_symbol: openai.ChatCompletion.create
      new_call: chat.completions.create
      root: module
      # The body parameters 0.28.1 sent untouched and every measured release still takes, and two
      # it read itself: engine, which was the route and so the model, and request_timeout. Not
      # api_key, stream, timeout or deployment_id, which the new methods lack or read otherwise.
      aliases:
        engine: model
      arg_map:
        request_timeout: timeout
      keywords:
        - frequency_penalty
        - function_call
        - functions
        - logit_bias
        - logprobs
        - max_tokens
        - messages
        - model
        - n
        - presence_penalty
        - request_timeout
        - response_format
        - seed
        - stop
        - temperature
        - tool_choice
        - tools
        - top_logprobs
        - top_p
        - user
      positive_numbers:
        - request_timeout
      result_paths:
        - choices[].finish_reason
        - choices[].index
        - choices[].message.content
        - choices[].message.role
        - created
        - id
        - model
        - usage.completion_tokens
        - usage.prompt_tokens
        - usage.total_tokens
    fixtures:
      - fixtures/negative/module_client_new.py
      - fixtures/positive/chat_completion.before.py
      - fixtures/positive/dict_reads.before.py
      - fixtures/positive/from_import.before.py
      - fixtures/positive/import_alias.before.py
      - fixtures/positive/renamed_arguments.before.py
      - fixtures/positive/response_shapes.before.py
      - fixtures/positive/result_names.before.py
      - fixtures/positive/unsupported_arguments.before.py

  - id: completion
    kind: rewrite_call
    citation: "openai-python v1.0.0 Migration Guide, 'Module client'"
    params:
      legacy_symbol: openai.Completion.create
      new_call: completions.create
      root: module
      aliases:
        engine: model
      arg_map:
        request_timeout: timeout
      keywords:
        - best_of
        - echo
        - frequency_penalty
        - logit_bias
        - logprobs
        - max_tokens
        - model
        - n
        - presence_penalty
        - prompt
        - request_timeout
        - seed
        - stop
        - suffix
        - temperature
        - top_p
        - user
      positive_numbers:
        - request_timeout
      result_paths:
        - choices[].finish_reason
        - choices[].index
        - choices[].text
        - created
        - id
        - model
        - usage.completion_tokens
        - usage.prompt_tokens
        - usage.total_tokens
    fixtures:
      - fixtures/negative/module_client_new.py
      - fixtures/positive/completion.before.py
      - fixtures/positive/renamed_arguments.before.py

  - id: embedding
    kind: rewrite_call
    citation: "openai-python v1.0.0 Migration Guide, 'Module client'"
    params:
      legacy_symbol: openai.Embedding.create
      new_call: embeddings.create
      root: module
      aliases:
        engine: model
      arg_map:
        request_timeout: timeout
      # Not encoding_format: 0.28.1 asked for base64 itself and decoded it with numpy.
      keywords:
        - input
        - model
        - request_timeout
        - user
      positive_numbers:
        - request_timeout
      result_paths:
        - data[].embedding
        - data[].index
        - model
        - usage.prompt_tokens
        - usage.total_tokens
    fixtures:
      - fixtures/negative/already_new.py
      - fixtures/positive/embedding.before.py
      - fixtures/positive/renamed_arguments.before.py

  - id: image
    kind: rewrite_call
    citation: "openai-python v1.0.0 Migration Guide, 'Module client'"
    params:
      legacy_symbol: openai.Image.create
      new_call: images.generate
      root: module
      # The body parameters 0.28.1 sent untouched and every measured release still takes; no
      # positional argument, since 0.28.1's first positional one was the API key. Not
      # response_format: the new model declares url, b64_json and revised_prompt optional, so a
      # read of one the server left out is None where 0.28.1 raised, and a handler would stop
      # running. The default format returns url, the one field listed.
      keywords:
        - model
        - n
        - prompt
        - quality
        - size
        - style
        - user
      result_paths:
        - created
        - data[].url
    fixtures:
      - fixtures/negative/module_client_new.py
      - fixtures/positive/image.before.py

  - id: moderation
    kind: rewrite_call
    citation: "openai-python v1.0.0 Migration Guide, 'Module client'"
    params:
      legacy_symbol: openai.Moderation.create
      new_call: moderations.create
      root: module
      # 0.28.1's signature was create(input, model=None, api_key=None). Neither is carried: it
      # dropped a model of None where the new method sends null, and refused any name but two.
      positional_to_kw:
        - input
      # Not the categories: 0.28.1 keyed them by names such as "self-harm" and "hate/threatening",
      # which the new model spells with underscores.
      result_paths:
        - id
        - model
        - results[].flagged
    fixtures:
      - fixtures/negative/module_client_new.py
      - fixtures/positive/moderation.before.py

  - id: transcription
    kind: rewrite_call
    citation: "openai-python v1.0.0 Migration Guide, 'Module client'"
    params:
      legacy_symbol: openai.Audio.transcribe
      new_call: audio.transcriptions.create
      root: module
      # 0.28.1's signature was transcribe(model, file, api_key=None, ...), and the new method is
      # keyword-only. Not response_format: "text", "srt" and "vtt" return a string on both sides, and
      # "verbose_json" a result with more fields than `text`.
      positional_to_kw:
        - model
        - file
      keywords:
        - language
        - prompt
        - temperature
      result_paths:
        - text
    fixtures:
      - fixtures/negative/module_client_new.py
      - fixtures/positive/audio.before.py

  - id: translation
    kind: rewrite_call
    citation: "openai-python v1.0.0 Migration Guide, 'Module client'"
    params:
      legacy_symbol: openai.Audio.translate
      new_call: audio.translations.create
      root: module
      positional_to_kw:
        - model
        - file
      keywords:
        - prompt
        - temperature
      result_paths:
        - text
    fixtures:
      - fixtures/negative/module_client_new.py
      - fixtures/positive/audio.before.py

  - id: api-base
    kind: rename_setting
    citation: "openai-python v1.0.0 Migration Guide, 'Module client'"
    params:
      settings:
        openai.api_base: base_url
      # The module client joins a route onto base_url as it stands, so "/v1" would send to
      # "/v1chat/completions"; 0.28.1 appended "/" + route itself and ended a literal without one.
      value_ends_with: /
    fixtures:
      - fixtures/negative/module_client_new.py
      - fixtures/positive/api_base.before.py
      - fixtures/positive/api_base_uses.before.py

  - id: flag-async-calls
    kind: flag_only
    citation: "openai-python v1.0.0 Migration Guide, 'Async client'"
    params:
      symbols:
        - openai.Audio.atranscribe
        - openai.Audio.atranscribe_raw
        - openai.Audio.atranslate
        - openai.Audio.atranslate_raw
        - openai.ChatCompletion.acreate
        - openai.Completion.acreate
        - openai.Embedding.acreate
        - openai.Image.acreate
        - openai.Image.acreate_edit
        - openai.Image.acreate_variation
        - openai.Moderation.acreate
      message: >-
        0.28.1 awaited these on the module. The new module client has no async
        form: an awaited call needs openai.AsyncOpenAI, which is a client the
        file must build and own.
      suggestion: >-
        Build an AsyncOpenAI client where the application starts, and await
        client.chat.completions.create (or completions, embeddings, images,
        audio) on it.
    fixtures:
      - fixtures/negative/already_new.py
      - fixtures/positive/async_calls.before.py

  - id: flag-settings
    kind: flag_only
    citation: "openai-python v1.0.0 Migration Guide, 'Module client'"
    params:
      symbols:
        - openai.aiosession
        - openai.api_key_path
        - openai.api_type
        - openai.api_version
        - openai.app_info
        - openai.ca_bundle_path
        - openai.debug
        - openai.enable_telemetry
        - openai.log
        - openai.proxy
        - openai.requestssession
        - openai.verify_ssl_certs
      message: >-
        0.28.1 read this module setting. The new releases either do not define
        it, so assigning it succeeds and changes nothing, or read it
        differently (api_type and api_version select an Azure client, once,
        when the first call builds it).
      suggestion: >-
        Build an openai.OpenAI(...) client with http_client or the Azure
        arguments instead, and call that, or set the new equivalent
        (default_headers) on the module before its first call.
    fixtures:
      - fixtures/negative/module_client_new.py
      - fixtures/positive/settings.before.py

  - id: flag-errors
    kind: flag_only
    citation: "openai-python v1.0.0 Migration Guide, 'All name changes'"
    params:
      symbols:
        - openai.InvalidRequestError
        - openai.error
      message: >-
        The 0.28.1 exception classes were renamed, and a handler for a name that
        is gone fails or never runs. The classes of the new releases carry other
        attributes: status_code and body where the old ones had http_status and
        json_body.
      suggestion: >-
        Catch openai.OpenAIError, or the status classes of the new release
        (BadRequestError, RateLimitError, APITimeoutError), and read
        status_code instead of http_status.
    fixtures:
      - fixtures/negative/already_new.py
      - fixtures/positive/error_handlers.before.py

  - id: flag-resources
    kind: flag_only
    citation: "openai-python v1.0.0 Migration Guide, 'All name changes'"
    params:
      symbols:
        - openai.Audio.transcribe_raw
        - openai.Audio.translate_raw
        - openai.Customer
        - openai.Deployment
        - openai.Edit
        - openai.Engine
        - openai.ErrorObject
        - openai.File
        - openai.FineTune
        - openai.FineTuningJob
        - openai.Image.create_edit
        - openai.Image.create_variation
        - openai.Model
      message: >-
        This pack does not rewrite this 0.28.1 resource. In the new releases
        the name is a stub that raises when called, and several of these
        endpoints (edits, fine-tunes) were shut down.
      suggestion: >-
        Port these call sites by hand: they become client.audio, client.files,
        client.images, client.models, client.moderations and
        client.fine_tuning.jobs, with keyword-only arguments and typed results.
    fixtures:
      - fixtures/negative/already_new.py
      - fixtures/positive/resources.before.py

  - id: flag-removed-modules
    kind: flag_only
    citation: "openai-python v1.0.0 Migration Guide, 'Removed'"
    params:
      symbols:
        - openai.api_requestor
        - openai.api_resources
        - openai.cli
        - openai.datalib
        - openai.embeddings_utils
        - openai.object_classes
        - openai.openai_object
        - openai.openai_response
        - openai.upload_progress
        - openai.util
        - openai.validators
        - openai.wandb_logger
      message: >-
        This module belongs to the 0.28.1 package. The new releases do not ship
        it, or ship another module under the name, so an import of it fails or
        reads something else once the pin moves.
      suggestion: >-
        Replace what the file takes from it with the new client and its typed
        results by hand.
    fixtures:
      - fixtures/negative/already_new.py
      - fixtures/positive/removed_modules.before.py

  - id: flag-indirect-use
    kind: flag_only
    citation: "openai-python v1.0.0 Migration Guide, 'Module client'"
    params:
      # Shape ids, never regexes: a pack carries nothing that drives behaviour.
      patterns:
        - dynamic_access
        - mock_patch_target
        - sys_modules_stub
      message: >-
        A legacy name is reached here as a string or through a dynamic import
        rather than by an import statement, so the rewrite cannot follow it. A
        patch target left on the old name stops standing in for the code once it
        has moved, so the test reaches the real library instead.
      suggestion: >-
        obelize writes nothing for openai while this target stands. Point it at
        the call the pack writes (openai.chat.completions.create for
        ChatCompletion.create) and make its fake return an object with
        attributes instead of a dict, then run again.
    fixtures:
      - fixtures/negative/module_client_new.py
      - fixtures/positive/mock_patch_target.before.py

  - id: dependency
    kind: manifest_dependency
    citation: "openai-python v1.0.0 Migration Guide, 'Getting started'"
    params:
      from_name: openai
      to_name: openai
      to_spec: ">=1.109.1"
    fixtures:
      - fixtures/negative/requirements_already_new.txt
      - fixtures/positive/requirements.before.txt

verification:
  suggestions:
    - "<project python> -m pytest -q"

limitations:
  - "Only openai.ChatCompletion.create, openai.Completion.create, openai.Embedding.create, openai.Image.create, openai.Moderation.create, openai.Audio.transcribe and openai.Audio.translate are rewritten, and only to the same call on the module (openai.chat.completions.create, openai.images.generate): no client object is built, so openai.api_key and openai.organization keep working as they did."
  - "A result is rewritten only when every read of it is a path the pack lists, such as response.choices[0].message.content. A read by string keys becomes that attribute path unless a handler that may take its KeyError surrounds it, and a part kept in a name, or walked by a loop, is followed the same way. The result or a part given to a function or returned, a loop over the whole result and response.get withhold the file: 0.28.1 results are dictionaries and the new ones are not."
  - "A handler may take a key read's KeyError when it names KeyError or LookupError, a class the file defines, or any imported class but a few of the standard library, such as socket.timeout or json.JSONDecodeError: an imported class may subclass KeyError out of sight. The read then stays a dictionary read and withholds the file, since the attribute read raises AttributeError."
  - "A key read stays a dictionary read, so it withholds the file, when its name may hold something else (bound twice, by a walrus, or reached by its string through locals() or a frame), or when it sits in a closure, a lambda, a generator expression or an f-string written with =."
  - "A result given to print withholds the file: 0.28.1 printed it as JSON and the new releases print a repr, which a program reading the output would not parse."
  - "The categories of a moderation are not among the paths the pack lists: 0.28.1 named them with hyphens and slashes (self-harm, hate/threatening), which the new model spells with underscores, so a read of one withholds the file."
  - "A call is refused unless every argument is one the pack lists, written as a keyword, or in the old order for Moderation.create and the two audio calls: other positional arguments, stream, deployment_id, timeout, api_key, api_base, the response_format of an audio call and a ** splat are not carried, since the new methods lack them or read them differently."
  - "engine= of a chat, text completion or embedding call becomes model=, and request_timeout= becomes timeout= when it is a number written out above zero; both are refused beside model= or as a name, zero or a tuple. 0.28.1 sent an engine in the URL, /engines/<name>/..., where the new methods send the model in the body, so the call reaches the API by another route. A request that times out is sent again twice by the new client, each attempt with that timeout, where 0.28.1 sent it once."
  - "Azure (api_type, api_version, deployment_id) and every setting with no counterpart in the new releases are reported, never rewritten: assigning them still succeeds and changes nothing."
  - "openai.api_base = value becomes openai.base_url = value, with a / added to a string literal and (\"%s\" % (value,)).rstrip(\"/\") + \"/\" around anything else, since the module client joins routes onto it unseparated. A file that already uses openai.base_url, or uses openai.api_base other than assigned (a read, +=, del, a tuple target, from openai import api_base), is withheld. The address is formed once, at the assignment, not at each request."
  - "Async calls, the other resources (File, Model, FineTune, the image edit and variation calls, the raw audio calls and the rest), the openai.error classes and the modules of the 0.28.1 package are reported, never rewritten. The top-level openai.APIError exists on both sides and is not reported, since code already on the new release uses it: a handler for it that reads http_status, json_body or user_message fails with AttributeError once the pin moves."
  - "The distribution is one, so the pin moves with the code or not at all: when any row of the repository is withheld, every file is left as it was and the pin stays (repo_not_fully_migrated)."
  - "A module that 0.28.1 installed and a release it migrates to does not (requests, aiohttp, urllib3, certifi, tqdm and the rest of what those two bring: see match.transitive), imported by a file while no manifest of the repository declares it, holds the repository until one does. Any manifest counts, not the one that governs the file."
  - "0.28.1 read OPENAI_API_BASE and OPENAI_ORGANIZATION from the environment, and the new releases read OPENAI_BASE_URL and OPENAI_ORG_ID, so a gateway or an organization set only there is lost without an error once the pin moves. Rename them where they are set: the code is not asked."
  - "The new module client also reads AZURE_OPENAI_ENDPOINT and AZURE_OPENAI_API_KEY: where either is set it builds an Azure client, or raises when OPENAI_API_KEY is set too. Set OPENAI_API_TYPE=openai on a machine that has both."
  - "The new module client sends with httpx where 0.28.1 used requests, so some defaults change. It retries a request that fails with 408, 409, 429, a 5xx status or a timeout twice, where 0.28.1 retried connection errors only, and waits 5 seconds to connect where 0.28.1 waited 600. REQUESTS_CA_BUNDLE is not read (SSL_CERT_FILE is). openai.max_retries and openai.timeout set the first two on the module."
  - "A test that intercepts requests, with responses or requests_mock, no longer sees the call. On Python 3.10 or newer the pin resolves to openai 3, which sends with httpx2 and does not install httpx, so a test that patches httpx alone, with an older RESPX, does not see it either."
  - "The new SDK types usage, choices[].message.content, Image data and data[].url as optional, where 0.28.1 returned Any, so mypy and pyright report reads of them that passed before. Add a None check where your code relies on them."
  - "The SDK's README now calls the module client the legacy module client. It works on every release measured, and a release may remove it."
  - "A library the repository declares that calls the 0.x API itself, such as langchain up to 0.0.331 through ChatOpenAI or guidance 0.0.x, installs beside the new pin and fails at its first call. Upgrade it in the same change and run --verify."
  - "A model name is kept as written. OpenAI retires models on a published schedule (https://platform.openai.com/docs/deprecations), so check each name your calls use against it."
  - "The file of Audio.transcribe or Audio.translate must be a binary file object, bytes or a path on the new side: 0.28.1 accepted any object with a name and a read method, a Django upload for one, and the new methods raise RuntimeError for it before sending. The upload is also named by its base name and its type guessed, where 0.28.1 sent the name as written."
  - "A file obelize cannot read holds nothing: one over the size limit, one it cannot open, a script with no .py name. The pin moves beside it, and the report lists the file."
  - "A notebook, .pyi or .pyw file that contains the word openai holds the whole repository, on either API and even in a markdown cell, because it is not analysed. List it under exclude in .obelize.yml and the rest moves; the file then runs on the new release and needs the same changes by hand. Under an include narrower than the default it is listed as excluded and holds nothing."
  - "A repository that declares openai below 0.27.0 (ChatCompletion starts there), or leaves it unpinned, is blocked, and so is one that uses it and declares it nowhere obelize reads: pin 0.27.0 or above and run again. The rules were measured on 0.27.0 to 0.28.1."
  - "A repository whose pyproject.toml or setup.cfg declares a Python below 3.8 is blocked. A Python declared only in setup.py or a Pipfile is not read."
  - "A requirement the pack cannot rewrite in place, openai[datalib] with extras for one, holds the whole repository (manifest_pin_shape_unsupported): edit that line by hand and run again."
  - "A declaration that already pins openai at 1.109.1 or above (openai==3.26.0, openai>=2) is left as written, and the code is still rewritten; one that admits an older release, openai>=0.28.1,<3 or openai>=1.0, is rewritten to openai>=1.109.1."
  - "A result bound to a module name that another module imports is read in this file only."
  - "Dynamic access, star imports and mock patch targets are reported, never rewritten. A patch target is seen only when it starts at openai: one written against your own module, as in myapp.llm.openai.ChatCompletion.create, is not."
  - "The module is followed inside one file. A name another of your modules re-exports (from mylib import openai) and a client built elsewhere are not seen."
  - "A file whose round trip through the parser is not byte-identical is reported and never edited."
