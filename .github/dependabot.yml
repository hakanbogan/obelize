# `examples/` and `bench/` are deliberately not covered: their SDK pins are fixtures (the example
# must stay on `google-generativeai`; bench cases pin measured versions).
---
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"

  # pyproject.toml and uv.lock together, so ci.yml's `lock` job passes; monthly, the list is small.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
    ignore:
      # Fixture pins (see top): migrating them is the product's job.
      - dependency-name: "google-generativeai"
      - dependency-name: "google-genai"
      # Measured pins (pyproject.toml): a newer pypdf or openai is a different surface.
      - dependency-name: "PyPDF2"
      - dependency-name: "pypdf"
      - dependency-name: "openai"
