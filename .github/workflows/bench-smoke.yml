# Offline fixture run and a docs/BENCHMARK_RESULTS.md staleness check; the full benchmark is
# local-only (docs/BENCHMARK.md). The results' gate-1 and error-analysis blocks are checked under
# `ci / test` (tests/unit/test_gate1.py, tests/unit/test_bench_errors.py).
name: bench-smoke

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly: this guards results freshness, not a release.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bench-smoke:
    name: bench-smoke (fixtures only, no network)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_FROZEN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          version: "0.12.15"

      - name: Sync the dev environment
        run: uv sync

      - name: python -m bench.run --fixtures-only
        # Starts nothing but the interpreter, so it cannot reach the network (ADR-042 D6).
        run: uv run python -m bench.run --fixtures-only

      - name: python -m bench.summarize --check
        # Fails when docs/BENCHMARK_RESULTS.md drifts from the committed bench/results/.
        run: uv run python -m bench.summarize --check
