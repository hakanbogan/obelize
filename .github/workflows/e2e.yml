# scan -> fix --apply on the bundled example app from a built wheel in a clean venv, asserting
# docs/CLI.md exit codes and docs/RUN_FOLDER.md evidence; `tests/e2e/` runs the flow in-process.
# The app's own suite is not run: the flow writes nothing to verify. Two steps check what the
# `openai/openai-0-to-1` pack claims on the releases the dev environment cannot hold.
name: e2e

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so a dependency release that breaks a fresh install shows (ADR-004).
    - cron: "43 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: e2e (example app, installed wheel)
    # A schedule runs only on a public repository (ADR-004); tests/unit/test_workflows.py
    # evaluates this `if:`.
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UV_FROZEN: "1"
      UV_BUILD_CONSTRAINT: ".github/build-constraints.txt"
      PACK_ID: gemini/google-generativeai-to-google-genai
      EXAMPLE_DIR: examples/gemini-legacy-app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Decide whether the end-to-end flow can run
        id: guard
        # Skips, and says why, unless the example app and every probed command exist.
        run: |
          set -euo pipefail
          missing=()
          if [ ! -f "$EXAMPLE_DIR/pyproject.toml" ] && [ ! -f "$EXAMPLE_DIR/requirements.txt" ]; then
            missing+=("the example application at $EXAMPLE_DIR")
          fi
          for cmd in scan fix verify; do
            if ! uv run --frozen obelize "$cmd" --help >/dev/null 2>&1; then
              missing+=("the \`obelize $cmd\` command")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            {
              echo "OBELIZE_VENV=$RUNNER_TEMP/obelize-venv"
              echo "APP_DIR=$RUNNER_TEMP/app"
            } >> "$GITHUB_ENV"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "SKIPPED: the end-to-end flow needs things that do not exist yet:"
            for m in "${missing[@]}"; do echo "  - $m"; done
            echo "No wheel was built and no scan/fix/verify flow was executed."
          fi

      - name: Build the wheel and install it into a clean venv (not editable)
        if: steps.guard.outputs.present == 'true'
        run: |
          set -euo pipefail
          uv build
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found ${#wheels[@]}"
            exit 1
          fi
          uv venv --python 3.12 "$OBELIZE_VENV"
          uv pip install --python "$OBELIZE_VENV/bin/python" "${wheels[0]}"
          "$OBELIZE_VENV/bin/obelize" --version

      - name: Copy the example app into a scratch git repo
        if: steps.guard.outputs.present == 'true'
        # --apply refuses a dirty tree (docs/THREAT_MODEL.md, TM-8) and must never touch this
        # checkout, so the example is migrated in its own committed repo.
        run: |
          set -euo pipefail
          cp -R "$EXAMPLE_DIR" "$APP_DIR"
          git -C "$APP_DIR" init -q
          git -C "$APP_DIR" config user.name "obelize ci"
          git -C "$APP_DIR" config user.email "ci@obelize.invalid"
          git -C "$APP_DIR" add -A
          git -C "$APP_DIR" commit -q -m "example app before migration"

      - name: obelize scan
        if: steps.guard.outputs.present == 'true'
        run: |
          set -euo pipefail
          "$OBELIZE_VENV/bin/obelize" scan --repo "$APP_DIR" --pack "$PACK_ID" --json \
            > "$RUNNER_TEMP/scan.json"
          jq -e '(.findings | length) > 0' "$RUNNER_TEMP/scan.json" > /dev/null \
            || { echo "::error::scan found no legacy SDK usage in the example app"; exit 1; }

      - name: obelize fix --apply
        if: steps.guard.outputs.present == 'true'
        # `4` (wrote nothing or left review items, docs/CLI.md) is correct here, not a failure.
        run: |
          set -euo pipefail
          set +e
          "$OBELIZE_VENV/bin/obelize" fix \
            --repo "$APP_DIR" \
            --pack "$PACK_ID" \
            --apply \
            --non-interactive
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 4 ]; then
            echo "::error::fix --apply exited $status (expected 0 or 4)"
            exit 1
          fi

      - name: Assert the run.json evidence
        if: steps.guard.outputs.present == 'true'
        run: |
          set -euo pipefail
          run_id=$(cat "$APP_DIR/.obelize/latest")
          run_json="$APP_DIR/.obelize/runs/$run_id/run.json"
          echo "run id: $run_id"
          test -f "$run_json"

          # No edit is expected: summarize.py and conversation.py run on summarizer/config.py's
          # `configure`, so that file is withheld as `configure_consumed_elsewhere`.
          jq -e --arg pack "$PACK_ID" '
            (.run_id      | type == "string" and (length > 0))
            and (.obelize_version | type == "string" and (length > 0))
            and (.mode         == "apply")
            and ((.packs       | length) == 1)
            and (.packs[0].id  == $pack)
            and (.packs[0].sha256 | test("^[0-9a-f]{64}$"))
            and (.git_dirty    == false)
            and (.verify.status == "not_run")
            and (.verify.reason == "no_changes_to_verify")
            and (.exit_code     == 4)
            and (.idempotent    == true)
            and ((.file_edits  | length) == 0)
            and (.counts.auto   == 0)
            and ((.withheld    | length) == 14)
            and (([.withheld[].bail] | map(select(. == "configure_consumed_elsewhere")) | length) == 1)
          ' "$run_json" > /dev/null \
            || { echo "::error::run.json did not match the expected shape"; jq . "$run_json"; exit 1; }

          for artefact in findings.json plan.json patch.diff REPORT.md "packs/$PACK_ID/pack.yaml" "packs/$PACK_ID/pack.sha256"; do
            test -f "$APP_DIR/.obelize/runs/$run_id/$artefact" \
              || { echo "::error::missing evidence artefact: $artefact"; exit 1; }
          done

      - name: Second fix changes nothing (idempotence)
        if: steps.guard.outputs.present == 'true'
        # A second apply must leave the tree byte-identical. No commit first: the first run
        # wrote nothing, and `git commit` refuses an empty commit.
        run: |
          set -euo pipefail
          set +e
          "$OBELIZE_VENV/bin/obelize" fix \
            --repo "$APP_DIR" \
            --pack "$PACK_ID" \
            --apply \
            --non-interactive
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 4 ]; then
            echo "::error::second fix exited $status (expected 0 or 4)"
            exit 1
          fi

          if ! git -C "$APP_DIR" diff --exit-code; then
            echo "::error::second fix modified tracked files; the migration is not idempotent"
            exit 1
          fi

          run_id=$(cat "$APP_DIR/.obelize/latest")
          jq -e '(.idempotent == true) and ((.file_edits | length) == 0)' \
            "$APP_DIR/.obelize/runs/$run_id/run.json" > /dev/null \
            || { echo "::error::second run.json did not report idempotent=true with zero file edits"; exit 1; }

      - name: Several packs in one run (quickstart, no --pack)
        if: steps.guard.outputs.present == 'true'
        # The quickstart uses two of the three bundled libraries, so one run with no `--pack` chooses
        # and applies those two packs, a scan of what it wrote finds no pack that applies, and one undo
        # puts every file back.
        run: |
          set -euo pipefail
          quickstart="$RUNNER_TEMP/quickstart"
          cp -R examples/quickstart "$quickstart"
          git -C "$quickstart" init -q
          git -C "$quickstart" config user.name "obelize ci"
          git -C "$quickstart" config user.email "ci@obelize.invalid"
          git -C "$quickstart" add -A
          git -C "$quickstart" commit -q -m "quickstart before migration"

          "$OBELIZE_VENV/bin/obelize" scan --repo "$quickstart" --json > "$RUNNER_TEMP/both.json"
          jq -e '[.packs[].id] == ["gemini/google-generativeai-to-google-genai", "py-pdf/pypdf2-to-pypdf"]' \
            "$RUNNER_TEMP/both.json" > /dev/null \
            || { echo "::error::scan did not choose both packs"; jq .packs "$RUNNER_TEMP/both.json"; exit 1; }

          set +e
          "$OBELIZE_VENV/bin/obelize" fix --repo "$quickstart" --apply --non-interactive
          status=$?
          set -e
          # `6`: the change is written and no verification command was given.
          if [ "$status" -ne 0 ] && [ "$status" -ne 6 ]; then
            echo "::error::fix --apply exited $status (expected 0 or 6)"
            exit 1
          fi
          fix_run=$(cat "$quickstart/.obelize/latest")
          grep -q "import pypdf" "$quickstart/app.py" \
            && grep -q "from google import genai" "$quickstart/app.py" \
            || { echo "::error::app.py was not migrated by both packs"; exit 1; }

          "$OBELIZE_VENV/bin/obelize" scan --repo "$quickstart" --json > "$RUNNER_TEMP/after.json"
          jq -e '(.packs == []) and (.findings == [])' "$RUNNER_TEMP/after.json" > /dev/null \
            || { echo "::error::a pack still applies after the migration"; jq .packs "$RUNNER_TEMP/after.json"; exit 1; }

          "$OBELIZE_VENV/bin/obelize" undo --run "$fix_run" --repo "$quickstart"
          git -C "$quickstart" diff --exit-code \
            || { echo "::error::undo did not put every file back"; exit 1; }

      - name: The openai pack's claims hold on 0.28.1, the release it migrates from
        # The old release cannot share the dev environment, so a clean one runs stdlib code that
        # compares it with the committed snapshot. `--no-project` reads no lock, which UV_FROZEN
        # would only warn about.
        env:
          UV_FROZEN: "0"
        run: >
          uv run --isolated --no-project --python 3.12 --with openai==0.28.1
          python -I tests/packs/openai_legacy_check.py tests/packs/openai_legacy_surface.json

      - name: The openai pack's claims hold on 1.109.1, the floor of the release it migrates to
        # The dev group pins 3.26.0; `--with` puts the floor ahead of it for this one file.
        run: >
          uv run --with openai==1.109.1
          pytest tests/packs/test_openai_facts.py -q --no-cov -p no:cacheprovider

      - name: The migrated openai fixtures do what the legacy ones did
        # The legacy fixtures run on 0.28.1 and their answer keys on the floor and the newest
        # release, each against a local server; the printed results must be the same.
        env:
          UV_FROZEN: "0"
        run: |
          set -euo pipefail
          fixtures=src/obelize/packs/openai/openai-0-to-1/fixtures/positive
          out="$(mktemp -d)"
          before=(); after=()
          for fixture in api_base audio chat_completion completion dict_reads embedding image \
            import_alias moderation result_names; do
            before+=("$fixtures/$fixture.before.py")
            after+=("$fixtures/$fixture.after.py")
          done
          check=tests/packs/openai_behaviour_check.py
          uv run --isolated --no-project --python 3.12 --with openai==0.28.1 --with numpy \
            python -I "$check" "${before[@]}" > "$out/legacy.txt"
          for release in "openai==1.109.1" "openai"; do
            uv run --isolated --no-project --python 3.12 --with "$release" \
              python -I "$check" "${after[@]}" > "$out/new.txt"
            diff "$out/legacy.txt" "$out/new.txt" \
              || { echo "::error::$release prints something else than 0.28.1 did"; exit 1; }
          done

      - name: Upload the evidence directory
        if: always() && steps.guard.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-evidence
          path: ${{ runner.temp }}/app/.obelize/
          include-hidden-files: true # the folder's name starts with a dot
          if-no-files-found: warn
          retention-days: 7
