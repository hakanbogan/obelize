name: obelize
description: Find what a dependency migration leaves in your code and fail the job, or upgrade a dependency in a copy and keep the move as a branch.
author: Hakan Bogan
branding:
  icon: search
  color: blue

inputs:
  version:
    description: >-
      The obelize release to run, such as 0.7.0. Pin it: any 0.x release can change what a scan
      reports.
    required: true
  mode:
    description: >-
      scan (the default) finds what a migration leaves in the code, annotates it and fails the job.
      upgrade tries to move each dependency in distributions to its newest release in a copy of the
      repository, runs the repository's own tests before and after, and uploads the branch it made,
      if the tests allowed the move, as a git bundle with a patch and a report. That runs the
      repository's code, so the job must have no credential that writes (check out with
      persist-credentials: false) and never run on pull_request_target, workflow_run or
      issue_comment; the action stops if it does. A second job opens the pull request
      (docs/UPGRADING_IN_CI.md). The inputs of the other mode are ignored.
    default: scan
  packs:
    description: >-
      Pack ids to run, separated by spaces, such as py-pdf/pypdf2-to-pypdf. Default: every pack the
      repository uses.
    default: ""
  library:
    description: >-
      A distribution that has no pack, such as requests: list every place the repository uses it.
      It cannot be combined with packs.
    default: ""
  modules:
    description: Modules of library as they are imported, separated by spaces, such as yaml.
    default: ""
  fail-on:
    description: >-
      The statuses that fail the job, separated by spaces: eligible, needs_review, unsupported.
      Empty fails on none.
    default: "eligible needs_review unsupported"
  sarif:
    description: >-
      true to upload the findings to code scanning. The job needs the security-events: write
      permission. Never use this action on pull_request_target.
    default: "false"
  distributions:
    description: >-
      upgrade mode: the dependencies to upgrade, separated by spaces, such as pydantic. Each is
      upgraded on its own and gets a folder of the artifact. The second job must be given this same
      list, from the workflow and not from the artifact.
    default: ""
  from:
    description: >-
      upgrade mode, with one distribution: the release the code is written for, such as 1.10.26,
      where no manifest declares the dependency or every declaration admits it. Default: the one
      the manifests name.
    default: ""
  fail-on-unproven:
    description: >-
      upgrade mode: true to fail the job when the tests did not prove the move (exit 3 or 6 of
      obelize upgrade). Default false: the job passes, and exit-code and changed say what happened.
      Any other exit code fails the job.
    default: "false"
  artifact-name:
    description: upgrade mode, the name of the artifact the bundles, patches and reports go to.
    default: obelize-upgrade
  working-directory:
    description: The repository root to scan or upgrade, relative to the workspace.
    default: "."

outputs:
  exit-code:
    description: >-
      The scan's exit code, 0 or 4 for a scan that ran; in upgrade mode, the code of the first
      upgrade that failed outright, else of the first that was not proven, else 0 (see docs/CLI.md).
    value: ${{ format('{0}{1}', steps.scan.outputs.exit-code, steps.upgrade.outputs.exit-code) }}
  sarif-file:
    description: The SARIF document the scan printed.
    value: ${{ steps.scan.outputs.sarif-file }}
  bundle-file:
    description: >-
      Upgrade mode: the git bundle of each branch that was made, separated by spaces.
    value: ${{ steps.upgrade.outputs.bundle-file }}
  report-file:
    description: >-
      Upgrade mode: the report of each branch that was made, separated by spaces.
    value: ${{ steps.upgrade.outputs.report-file }}
  changed:
    description: Upgrade mode, true if at least one dependency was upgraded to a branch.
    value: ${{ steps.upgrade.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: false
        version: "0.12.15"

    - name: Check the mode
      if: ${{ inputs.mode != 'scan' && inputs.mode != 'upgrade' }}
      shell: bash
      env:
        OBELIZE_MODE: ${{ inputs.mode }}
      run: |
        echo "::error::mode takes scan or upgrade, got '$OBELIZE_MODE'"
        exit 2

    - name: Scan
      id: scan
      if: ${{ inputs.mode == 'scan' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        OBELIZE_VERSION: ${{ inputs.version }}
        OBELIZE_PACKS: ${{ inputs.packs }}
        OBELIZE_LIBRARY: ${{ inputs.library }}
        OBELIZE_MODULES: ${{ inputs.modules }}
        OBELIZE_FAIL_ON: ${{ inputs.fail-on }}
        OBELIZE_WORKDIR: ${{ inputs.working-directory }}
        OBELIZE_SARIF_FILE: ${{ runner.temp }}/obelize.sarif
      run: '"$ACTION_PATH/action/scan.sh"'

    - name: Annotate
      if: ${{ inputs.mode == 'scan' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        OBELIZE_SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
      run: python3 "$ACTION_PATH/action/annotate.py" "$OBELIZE_SARIF_FILE"

    - name: Upload to code scanning
      if: ${{ !cancelled() && inputs.mode == 'scan' && inputs.sarif == 'true' && (steps.scan.outputs.exit-code == '0' || steps.scan.outputs.exit-code == '4') }}
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        category: obelize
        wait-for-processing: "false"

    - name: Fail on what was found
      if: ${{ inputs.mode == 'scan' }}
      shell: bash
      env:
        OBELIZE_EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
      run: exit "${OBELIZE_EXIT_CODE:-1}"

    - name: Upgrade
      id: upgrade
      if: ${{ inputs.mode == 'upgrade' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        OBELIZE_VERSION: ${{ inputs.version }}
        OBELIZE_DISTRIBUTIONS: ${{ inputs.distributions }}
        OBELIZE_FROM: ${{ inputs.from }}
        OBELIZE_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        OBELIZE_WORKDIR: ${{ inputs.working-directory }}
        OBELIZE_OUT: ${{ runner.temp }}/obelize-upgrade
      run: python3 "$ACTION_PATH/action/upgrade.py" run

    - name: Upload the upgrade
      if: ${{ !cancelled() && inputs.mode == 'upgrade' && steps.upgrade.outputs.out-dir != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.upgrade.outputs.out-dir }}
        if-no-files-found: error
        retention-days: 7

    - name: Fail on an upgrade that was not proven
      if: ${{ !cancelled() && inputs.mode == 'upgrade' && steps.upgrade.outcome == 'success' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        OBELIZE_EXIT_CODE: ${{ steps.upgrade.outputs.exit-code }}
        OBELIZE_FAIL_ON_UNPROVEN: ${{ inputs.fail-on-unproven }}
      run: python3 "$ACTION_PATH/action/upgrade.py" gate
