# The answer key for `generative_model_calls`, written by hand before the rule.
#
# This corpus runs **every** implemented rule, in the order the pack declares
# them, because this rule depends on both of the others: it emits calls against
# the client `configure_to_client` placed, and it reaches the configuration
# class through the name `rename_import` bound. A corpus that ran it alone
# would be grading it against two names no file contains.
#
# `complete` is the claim that `obelize fix --apply` writes `<name>.after.py`:
# every eligible finding in the file is claimed by a rule that exists, every
# edit is `auto`, and there is at least one. That last clause is not pedantry --
# `escaping_model` and `chat_chained` have nothing eligible at all, so a run
# writes nothing and the file each leaves behind is the file it found. When
# `complete` is false the key is still what the rules produce; one of them may
# have succeeded while this one refused, and ADR-010 F-1 leaves the file
# untouched in a real run. Those files say so in their own docstrings, so the
# caveat travels with the bytes.
#
# Every one of the fifteen bails this rule raises is graded here, and all but
# one of them is a code no `ground_truth.yaml` could grade. `ScanSpec` carries
# no `generation_config_keys`, no safety table, no
# history shape, no rewrite map and no response table by construction, so
# `obelize scan` grades those files `eligible` with no bail and only a rewrite
# can see the defect. Seven of the cases here are the ones
# `tests/fixtures/scan/COVERAGE.md` gaps 2, 3, 4, 6, 10, 11 and 12 name.
case: generative_model_calls
rules:
  - rename-import
  - configure-to-client
  - generative-model-calls
pack: gemini/google-generativeai-to-google-genai

cases:
  # --- complete: the file a run would write ---------------------------------
  - file: model_constant
    what_it_is: >-
      The whole of the easy migration reduced to what this rule owns: a module
      constant, an inline configuration, one call that generates and one that
      counts.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 10, rule: rename-import, status: auto}
      - {line: 12, rule: configure-to-client, status: auto, warnings: [client_constructed_eagerly]}
      - {line: 14, rule: generative-model-calls, status: auto}
      - {line: 16, rule: generative-model-calls, status: auto}
      - {line: 21, rule: generative-model-calls, status: auto}
      - {line: 25, rule: generative-model-calls, status: auto, warnings: [count_tokens_config_dropped]}
    notes: >-
      Line 14 is the constructor and line 16 the configuration written inside
      it; both are claimed, and the second is what makes `from google.genai
      import types` appear. The token count carries the warning and the
      generation does not, because the new count takes no configuration at all
      and the generation takes the same one.

  - file: dict_config
    what_it_is: >-
      The configuration as a mapping literal, which is the form the legacy SDK
      did not validate.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 8, rule: rename-import, status: auto}
      - {line: 10, rule: configure-to-client, status: auto}
      - {line: 12, rule: generative-model-calls, status: auto}
      - {line: 16, rule: generative-model-calls, status: auto}
    notes: >-
      Every key is checked against the legal fifteen before it becomes a field
      of a class that would accept it. The client edit carries no warning: the
      key is a non-empty string literal, which is ADR-013 D5's one exemption.

  - file: system_instruction
    what_it_is: >-
      A constructor keyword that becomes a field of the configuration, with no
      configuration object anywhere in the source.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 8, rule: rename-import, status: auto}
      - {line: 10, rule: configure-to-client, status: auto}
      - {line: 12, rule: generative-model-calls, status: auto}
      - {line: 18, rule: generative-model-calls, status: auto}
    notes: >-
      The emitted call is invented rather than rebuilt, which is the one case
      where the layout rule has no earlier decision to respect. The
      constructor is written across two lines and the configuration it
      produces is not: what decides the emitted layout is the node the
      arguments came from, and here there is none.

  - file: call_config
    what_it_is: >-
      A configuration on the constructor and another on the call.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 8, rule: rename-import, status: auto}
      - {line: 10, rule: configure-to-client, status: auto}
      - {line: 12, rule: generative-model-calls, status: auto}
      - {line: 18, rule: generative-model-calls, status: auto}
    notes: >-
      The legacy SDK merged the two and let the call win key by key, so
      `temperature` is the call's value in the constructor's position and
      `top_p` survives. The call's own mapping is what the emitted layout
      follows, because that is the later of the two decisions the author made.

  - file: stream_flags
    what_it_is: >-
      The streaming flag in both of the two spellings a literal can have.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 8, rule: rename-import, status: auto}
      - {line: 10, rule: configure-to-client, status: auto}
      - {line: 12, rule: generative-model-calls, status: auto}
      - {line: 16, rule: generative-model-calls, status: auto}
      - {line: 21, rule: generative-model-calls, status: auto}
    notes: >-
      `True` goes to a differently named method and `False` is the legacy
      default written out, so the keyword goes and the call does not move. The
      streaming call is in the header of a `for`, which is why the width it is
      measured at is read off the source line rather than off a statement.

  - file: positional_config
    what_it_is: >-
      C-22's own example: three positional arguments with the middle one
      written as `None`.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 9, rule: rename-import, status: auto}
      - {line: 11, rule: configure-to-client, status: auto}
      - {line: 13, rule: generative-model-calls, status: auto, warnings: [positional_args_mapped_by_index]}
      - {line: 17, rule: generative-model-calls, status: auto}
    notes: >-
      The second positional is the safety table and the third is the
      configuration, which is the mapping a reader has to be able to check --
      hence the warning. `None` is how a caller reaches a later positional
      parameter and says exactly what leaving it out says, so it is not given.

  - file: prefixed_model_name
    what_it_is: >-
      A model named as a resource rather than as a bare name.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 8, rule: rename-import, status: auto}
      - {line: 10, rule: configure-to-client, status: auto}
      - {line: 12, rule: generative-model-calls, status: auto, warnings: [model_name_looks_prefixed]}
      - {line: 16, rule: generative-model-calls, status: auto}
    notes: >-
      Both SDKs accept it, so the string is carried across exactly as written.
      The warning is on the constructor's row and not on the call's: the
      literal is the constructor's, however many calls it is folded into.

  - file: local_model
    what_it_is: >-
      A model built and read inside one function, with the client above it.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 8, rule: rename-import, status: auto}
      - {line: 10, rule: configure-to-client, status: auto}
      - {line: 14, rule: generative-model-calls, status: auto}
      - {line: 15, rule: generative-model-calls, status: auto}
    notes: >-
      A local binding rather than a module constant, which is a different row
      of the resolution table and the same rewrite. The client stays at module
      level, because the `configure` is there.

  - file: self_attr_model
    what_it_is: >-
      A model on the instance, read from two other methods, with the client on
      the same instance.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 10, rule: rename-import, status: auto}
      - {line: 17, rule: configure-to-client, status: auto}
      - {line: 18, rule: generative-model-calls, status: auto}
      - {line: 21, rule: generative-model-calls, status: auto}
      - {line: 24, rule: generative-model-calls, status: auto}
    notes: >-
      This rule writes `self.client.models...` without knowing how `self.`
      was decided: ADR-026 D3's table chose it and recorded the expression,
      and this rule spells its calls against whatever is there. The two calls
      are laid out differently -- one fits on its line and the other does not
      -- which is the width clause deciding two lines of one class.

  - file: comment_above_the_model
    what_it_is: >-
      A comment written about the statement this rule deletes.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 10, rule: rename-import, status: auto}
      - {line: 12, rule: configure-to-client, status: auto}
      - {line: 15, rule: generative-model-calls, status: auto}
      - {line: 19, rule: generative-model-calls, status: auto}
    notes: >-
      The comment moves onto the statement that now comes first, after that
      statement's own blank lines. The blank line that separated the comment
      from the client does not move: the statement it lands on has blank lines
      of its own, and two sets of them would be a gap nobody wrote.

  - file: model_defined_last
    what_it_is: >-
      The deleted statement is the last one in its block, so there is nothing
      after it for the comment to move onto.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 9, rule: rename-import, status: auto}
      - {line: 11, rule: configure-to-client, status: auto}
      - {line: 15, rule: generative-model-calls, status: auto}
      - {line: 19, rule: generative-model-calls, status: auto}
    notes: >-
      The comment goes to the end of the block and keeps the blank lines that
      separated it from what is above, because nothing else is going to supply
      them -- and it lands **in front of** the note the file already ended
      with, because that is the order they were written in. Defining the model
      after the function that reads it is legal and unusual; the point of the
      case is where the prose lands.

  - file: two_statements_on_one_line
    what_it_is: >-
      The constructor shares its line with a statement that is not this rule's.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 8, rule: rename-import, status: auto}
      - {line: 10, rule: configure-to-client, status: auto}
      - {line: 12, rule: generative-model-calls, status: auto}
      - {line: 16, rule: generative-model-calls, status: auto}
    notes: >-
      What is deleted is the statement and not the line, so the line survives
      with what is left on it -- and the semicolon goes, because a semicolon
      belongs to the statement that follows it and that statement is gone.

  - file: from_import_model
    what_it_is: >-
      Both legacy names on one `from` line, and both of them consumed.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 9, rule: rename-import, status: auto}
      - {line: 11, rule: configure-to-client, status: auto}
      - {line: 13, rule: generative-model-calls, status: auto}
      - {line: 17, rule: generative-model-calls, status: auto}
    notes: >-
      `../rename_import/top_level_symbol.before.py` is this shape graded by one
      rule, where the honest answer is `from_import_unmigrated_symbol`. Here
      three rules run, both names are consumed, and the line becomes the module
      import the new calls are reached through -- which is ADR-026 D5's
      mechanism reaching its second and third symbols.

  - file: types_config_symbol
    what_it_is: >-
      The configuration class reached through the submodule the import rule
      owns.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 10, rule: rename-import, status: auto}
      - {line: 11, rule: rename-import, status: auto}
      - {line: 15, rule: rename-import, status: auto}
      - {line: 13, rule: configure-to-client, status: auto}
      - {line: 15, rule: generative-model-calls, status: auto}
      - {line: 19, rule: generative-model-calls, status: auto}
    notes: >-
      Line 15 carries two rows and they belong to two rules: the import rule
      claims the configuration, because the name it is reached by is one of
      the names that rule rewrites, and this rule claims the constructor. The
      submodule is already bound by the time this rule asks for it, which is
      the branch of the import manager the other configuration cases do not
      reach. The rows are in rule order rather than line order, because each
      rule reports its own in document order and the corpus concatenates them.

  - file: count_tokens_only
    what_it_is: >-
      A configuration that reaches no call at all, because the only call drops
      it.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 9, rule: rename-import, status: auto}
      - {line: 11, rule: configure-to-client, status: auto}
      - {line: 13, rule: generative-model-calls, status: auto}
      - {line: 17, rule: generative-model-calls, status: auto, warnings: [count_tokens_config_dropped]}
    notes: >-
      The pair with `model_constant`, and what separates them is the import:
      nothing here mentions the submodule, so no import of it is written. A
      rule that decided which imports it needs before deciding which arguments
      survive would leave an unused line in this file.

  - file: types_name_taken
    what_it_is: >-
      A module that already binds the submodule's own name, but not the
      fallback.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 9, rule: rename-import, status: auto}
      - {line: 13, rule: configure-to-client, status: auto}
      - {line: 15, rule: generative-model-calls, status: auto}
      - {line: 19, rule: generative-model-calls, status: auto}
    notes: >-
      The middle rung of the same ladder `types_names_taken` grades the bottom
      of. The emitted configuration is spelled `genai_types.GenerateContentConfig`,
      because the name a rule writes is the one the import manager handed back
      and not the one the pack prefers.

  - file: safety_settings_kwarg
    what_it_is: >-
      A constructor keyword that is rebuilt rather than carried.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 10, rule: rename-import, status: auto}
      - {line: 12, rule: configure-to-client, status: auto}
      - {line: 14, rule: generative-model-calls, status: auto}
      - {line: 20, rule: generative-model-calls, status: auto}
    notes: >-
      The second argument this rule generates rather than moves. The row this
      file used to carry graded it `unknown_ctor_kwarg`, because the pack
      declared the keyword for the scan and gave it no destination; the pack
      has one now and the refusal moved with it, which is what "the refusal is
      the pack's" meant.

  - file: safety_table
    what_it_is: >-
      Four categories and four thresholds, at four of the spellings the legacy
      lookup accepted.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 10, rule: rename-import, status: auto}
      - {line: 12, rule: configure-to-client, status: auto}
      - {line: 14, rule: generative-model-calls, status: auto}
      - {line: 26, rule: generative-model-calls, status: auto}
    notes: >-
      The canonical long form, a short alias, a shorter one and a mixed-case
      one, against four thresholds written the same four ways. The legacy
      lookup was `value.lower()` into a closed dictionary, so all eight are
      rows of the pack's tables and none of them is a rule reading a name. The
      emitted order is the order the author wrote, because a table is data.

  - file: safety_enum_members
    what_it_is: >-
      The same table written as enum members, including one that is a member
      and never was a string.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 10, rule: rename-import, status: auto}
      - {line: 16, rule: rename-import, status: auto}
      - {line: 16, rule: rename-import, status: auto}
      - {line: 12, rule: configure-to-client, status: auto}
      - {line: 14, rule: generative-model-calls, status: auto}
      - {line: 21, rule: generative-model-calls, status: auto}
    notes: >-
      A member carries across under its own name, so the member lists and the
      string tables are two different sets and the pack declares both.
      `HarmBlockThreshold.OFF` is the case that makes the difference visible:
      it is a member of both enums and `"off"` was never a key of the legacy
      lookup, which is why one is rewritten here and the other is refused two
      files down. The two rename-import rows on line 16 are the two enum
      spellings, which that rule claims and maps to themselves.

  - file: safety_list_of_dicts
    what_it_is: >-
      The other shape the legacy SDK took: a list of one-row mappings.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 9, rule: rename-import, status: auto}
      - {line: 11, rule: configure-to-client, status: auto}
      - {line: 13, rule: generative-model-calls, status: auto}
      - {line: 23, rule: generative-model-calls, status: auto}
    notes: >-
      Both forms become the same list of objects. The two keys a row is read
      by are pack data and not knowledge: they are spelled the way the new
      class spells its arguments in this pair of SDKs, and a rule that assumed
      that would pass here and fail against the invented SDK in
      `tests/unit/`.

  - file: safety_on_the_call
    what_it_is: >-
      A safety table on the constructor and another on the call, merged by
      category.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 9, rule: rename-import, status: auto}
      - {line: 11, rule: configure-to-client, status: auto}
      - {line: 13, rule: generative-model-calls, status: auto}
      - {line: 20, rule: generative-model-calls, status: auto}
    notes: >-
      `merged_ss.update(safety_settings)` over a mapping keyed by category,
      read off the installed 0.8.6, so the call wins **per category** and not
      wholesale: the shared category takes the call's threshold in the
      constructor's position and the category only the call names is appended.
      A rule that replaced the whole table would drop a category the author
      set and never mention it.

  - file: count_tokens_safety
    what_it_is: >-
      A safety table, and a call that counts tokens rather than generating
      them.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 10, rule: rename-import, status: auto}
      - {line: 12, rule: configure-to-client, status: auto}
      - {line: 14, rule: generative-model-calls, status: auto}
      - {line: 20, rule: generative-model-calls, status: auto, warnings: [count_tokens_config_dropped]}
    notes: >-
      `types.CountTokensConfig` has no safety field and a threshold does not
      change how many tokens a prompt is, so the table goes the way the
      sampling configuration goes (ADR-010 F-3) and the edit says so. The
      keyword that refuses instead is `system_instruction`, which is next
      door in `count_tokens_semantics`.

  - file: chat_surface
    what_it_is: >-
      A model read through the chat surface, and a chat read through its own.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 10, rule: rename-import, status: auto}
      - {line: 12, rule: configure-to-client, status: auto}
      - {line: 14, rule: generative-model-calls, status: auto}
      - {line: 18, rule: generative-model-calls, status: auto}
      - {line: 22, rule: generative-model-calls, status: auto}
      - {line: 23, rule: generative-model-calls, status: auto}
    notes: >-
      The file that made `receiver_method_unmapped` necessary, now that the
      methods have rewrites. Four edits from this rule over two bindings: the
      constructor, one model call, the `start_chat` that produces the chat and
      the chat's own `send_message`. The last of those is the one rewrite in
      the pack that is rooted on the receiver rather than on the client, so it
      keeps the name the author bound and gains neither a model nor a
      configuration.

  - file: chat_history
    what_it_is: >-
      A literal chat history, and the one argument whose value is rewritten.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 11, rule: rename-import, status: auto}
      - {line: 13, rule: configure-to-client, status: auto}
      - {line: 15, rule: generative-model-calls, status: auto}
      - {line: 19, rule: generative-model-calls, status: auto, warnings: [history_parts_rewritten]}
      - {line: 25, rule: generative-model-calls, status: auto}
    notes: >-
      Each string part becomes `{"text": ...}` and the list keeps its own
      layout, because only the parts are rebuilt and everything around them is
      the node the author wrote. The generated key is quoted the way the key
      beside it is. The warning is on the `start_chat` row only: it is the
      edit that reshapes a data literal, and the model's configuration
      reaching `chats.create` is not a reshaping. `send_message(content=)`
      becomes `send_message(message=)` on line 25, which is C-17 and is a
      `TypeError` after migration if it is missed. The second part is an
      f-string, which is a value that is certainly a string and is wrapped for
      that reason and no other.

  - file: chat_history_already_text
    what_it_is: >-
      A history already written the way the new SDK wants it.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 9, rule: rename-import, status: auto}
      - {line: 11, rule: configure-to-client, status: auto}
      - {line: 13, rule: generative-model-calls, status: auto}
      - {line: 17, rule: generative-model-calls, status: auto}
      - {line: 18, rule: generative-model-calls, status: auto}
    notes: >-
      Nothing is reshaped, so there is no warning -- which is what separates
      this row from its neighbour's and is why the warning is emitted from
      what happened rather than from what was asked for. The positional
      `send_message(text)` is lifted onto the renamed keyword, because a
      rewritten call names its arguments and C-17's rename is the thing a
      reviewer has to be able to see.

  - file: chat_send_stream
    what_it_is: >-
      Streaming on the chat, which is a different method rather than a
      keyword.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 8, rule: rename-import, status: auto}
      - {line: 10, rule: configure-to-client, status: auto}
      - {line: 12, rule: generative-model-calls, status: auto}
      - {line: 16, rule: generative-model-calls, status: auto}
      - {line: 17, rule: generative-model-calls, status: auto}
    notes: >-
      The same literal-flag rule as the model's own streaming call, one object
      further along, and the same refusal beside it: a non-literal flag is
      `dynamic_stream_flag` wherever it is written.

  - file: async_calls
    what_it_is: >-
      The async methods, where the `await` the author wrote is left alone.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 8, rule: rename-import, status: auto}
      - {line: 10, rule: configure-to-client, status: auto}
      - {line: 12, rule: generative-model-calls, status: auto}
      - {line: 16, rule: generative-model-calls, status: auto}
      - {line: 21, rule: generative-model-calls, status: auto}
    notes: >-
      Both sides are coroutine functions, so the rewrite is the service and
      the method name and nothing else. The `await` survives because this rule
      replaces the call and never the expression around it, which is the same
      mechanism that keeps `return `, `.total_tokens` and a trailing comment
      where they are. No warning on either row: the warning belongs to the
      streaming branch, where dropping the `await` is the mistake that
      compiles.

  - file: async_stream
    what_it_is: >-
      The async streaming branch, and the `await` that has to survive it.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 12, rule: rename-import, status: auto}
      - {line: 14, rule: configure-to-client, status: auto}
      - {line: 16, rule: generative-model-calls, status: auto}
      - {line: 20, rule: generative-model-calls, status: auto, warnings: [async_stream_await_preserved]}
    notes: >-
      ADR-008 wrote this shape with no `await` and called the fix an inserted
      one; ADR-010 F-8 corrected it on a measurement, and this is the file that
      pins the correction. The warning is what makes the preserved `await`
      visible in the report, because an implementation that derived this from
      the sync streaming rule would drop it and the file would fail at runtime
      rather than at import.

  - file: chat_send_config
    what_it_is: >-
      A configuration on the chat's own call, and the merge the new SDK does
      not do.
    complete: true
    after: present
    unclaimed: []
    edits:
      - {line: 10, rule: rename-import, status: auto}
      - {line: 12, rule: configure-to-client, status: auto}
      - {line: 14, rule: generative-model-calls, status: auto}
      - {line: 20, rule: generative-model-calls, status: auto}
      - {line: 21, rule: generative-model-calls, status: auto}
    notes: >-
      The legacy SDK merged the model's configuration into the call's; the new
      `Chat.send_message` is `config if config else self._config`, read off the
      installed 2.23.0, so it **replaces**. A call that overrides one key has
      to restate all of them, and `top_p` reaching line 21 is the whole of
      that: a rewrite that moved only what the call named would drop a setting
      the author made and say nothing. The chat's own `config=` on line 20 is
      the same merge with nothing to merge.

