    confidence_reason: alias_resolved
    verdict: needs_review
    bail: module_alias_rebound
    note: >-
      The import itself resolves cleanly, but the alias escapes at line 11, so
      the whole file is needs_review under bail `module_alias_rebound`.
      Renaming the import alone would leave `g.GenerativeModel` pointing at a
      module that no longer exists.
