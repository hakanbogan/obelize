must_not_report:
  - file: alias_rebound.py
    line: 13
    why: >-
      `g.configure(...)` resolves ONLY to a LOCAL name - verified, QNP returns
      nothing under the legacy prefix for lines 13, 17 and 21. It must not be
      reported as an `auto` configure-to-client rewrite. The file-level
      `needs_review` is what covers it.
  - file: alias_rebound.py
    line: 17
    why: >-
      `g.GenerativeModel("gemini-1.5-pro").generate_content(prompt)` - the
      whole legacy chain, invisible to resolution. Reporting nothing for this
      LINE is correct; reporting nothing for the FILE is the bug C-05 exists
      to prevent.
  - file: alias_rebound.py
    line: 21
    why: Same as line 17, through a named local variable.
  - file: alias_rebound.py
    line: 22
    why: >-
      `model.generate_content("%d bullets:\n%s" % (n, prompt))` - the one line in this file a
      binding pass is most likely to rewrite on its own, because `model` IS bound in this scope and
      the method name matches. It must not be reported, because the constructor it is bound to
      (line 21) went through `g` and is invisible to resolution, so there is no `ctor_symbol` and
      no model name to emit. Reporting it would mean inventing one.
  - file: name_shadowed.py
    line: 14
    why: >-
      `genai = None`. Verified: the assignment target resolves to
      [('genai', LOCAL)] - no legacy qualified name - so this line is not a
      finding of its own. It is the CAUSE of the file's bail, recorded in the
      notes of lines 9, 16 and 18.
  - file: conditional_import.py
    line: 3
    why: >-
      The docstring contains the hyphenated distribution name
      `google-generativeai`. It trips the prefilter token but is not the
      dotted module path, so it is not a `text_mention` either.
  - file: conditional_import.py
    line: 12
    why: >-
      `from google import genai` is the NEW SDK, in the except branch. It must
      not be reported as a legacy import and must not be rewritten; its
      presence is only what makes line 21 carry two IMPORT names.
  - file: star_import.py
    line: 10
    symbol: os
    why: >-
      The `os` in `os.environ` is also an unresolved-looking bare name on this
      line, but ScopeProvider gives it an assignment record (verified), so it
      is not a star-import candidate. Only `configure` on this line is.
  - file: star_import.py
    line: 16
    why: >-
      `len(prompt)`. Measured with libcst 1.9.0: `len` DOES have an assignment
      record through the builtin scope, so the ADR-008 candidate rule excludes
      it. A hand-rolled scope-chain walk that stops at the module scope would
      wrongly report every builtin in the file.
  - file: model_escapes.py
    line: 21
    why: >-
      The parameter named `model` in `run_with(model, prompt)` is a different
      binding from the module-level `MODEL`. A binding pass that keys on the
      variable name rather than on the scope record would merge them and
      report line 22 as an automatic rewrite with the wrong model name.
  - file: class_attr.py
    line: 20
    why: >-
      `self.labels = labels` is a `self_attr` assignment that has nothing to
      do with the SDK. A D2 implementation that records every `self.X = ...`
      must key on the constructor call, not on the assignment shape.
  - file: mock_target.py
    line: 9
    why: >-
      `model_cls.return_value.generate_content.return_value.text` - a
      `.generate_content` attribute chain on a Mock. This module has no legacy
      import at all, so a name-based `.generate_content` heuristic must be
      gated on the module importing the SDK.
  - file: mock_target.py
    line: 13
    why: >-
      `@mock.patch("myapp.summariser.genai")` patches the application's own
      module. The string ends in `.genai`, so an alias-level substring matcher
      flags it. It is also a known MISS, not a false positive - see notes.
  - file: mock_target.py
    line: 15
    why: >-
      `genai_mod.GenerativeModel...` resolves to
      ('test_summarise_through_our_module.<locals>.genai_mod.GenerativeModel',
      LOCAL) - verified. LOCAL source, so the resolution rule rejects it.
  - file: two_configures.py
    line: 24
    why: >-
      `model = build(env)` binds a name called `model` with no constructor in
      sight. A binding pass keyed on the name would invent a binding group
      here.
  - file: no_configure.py
    line: 3
    why: >-
      The docstring says "`configure()` is called once in app/bootstrap.py".
      A raw-string search for `configure` would report a client source that
      does not exist in this file - the opposite of the intended verdict.
  - file: two_assignments.py
    line: 19
    why: >-
      `model = registry.default_model()`. The right-hand side resolves to
      nothing under the legacy prefix, so there is no symbol to report and no
      constructor to rewrite. It is the reason the group bails: a scanner that
      skipped this line as uninteresting would see one constructor, one use
      and a closed world.
  - file: two_assignments.py
    line: 11
    why: >-
      `from myapp import registry`. A `from ... import` of a module that is
      not the legacy one, on the line directly below the import that is.
  - file: local_import.py
    line: 21
    why: >-
      `import json`, inside a function body. A rule keyed on "an import that
      is not at module level" rather than on the module it names reports this
      line, which is how `local_import` turns from a bail into a false
      positive in every repository that imports anything lazily.
  - file: local_import.py
    line: 23
    why: >-
      `json.dumps(rows, indent=2)`. A method call on a receiver with no
      binding record, in a file that demonstrably builds a legacy object,
      which is ADR-019 D5's shape. It must not be reported because `dumps` is
      not a method of any receiver the pack declares.
  - file: self_reassigned.py
    line: 22
    why: >-
      `self.model = model`. Nothing on the right resolves under the legacy
      prefix, so there is nothing to report; it is one of the two assignments
      that make the group unwritable.
  - file: self_reassigned.py
    line: 25
    why: >-
      `self.model = None`, the other one.
  - file: imports_the_model.py
    line: 2
    why: >-
      `from imported_model import MODEL`. Nothing on it resolves under the
      legacy prefix, so this file has no finding at all; it is why
      `imported_model.py`'s group is withheld.

notes: |
  Line numbers were checked against `cat -n` for every file, and every
  resolution claim in this document was measured by running libcst 1.9.0's
  QualifiedNameProvider and ScopeProvider over the fixture
  (`MetadataWrapper(module, unsafe_skip_copy=True)`). All eleven files also
  round-trip byte-identically and pass `compile()`, so none of them is
  confounded by `roundtrip_mismatch` or `parse_error`.

  The measured resolutions, verbatim:

    alias_rebound.py      L11 Name       -> [('google.generativeai', IMPORT)]
                          L13/L17/L21    -> nothing under the legacy prefix
    name_shadowed.py      L16, L18       -> LOCAL + IMPORT on the same node
                          L14 Name genai -> [('genai', LOCAL)] only
    conditional_import.py L16, L21       -> two IMPORT names, google.genai.* and
                                            google.generativeai.*
    star_import.py        every node     -> {} ; GlobalScope accesses with no
                                            assignment record: configure (L10),
                                            GenerativeModel (L12). `os` and `len`
                                            DO have assignment records.
    dynamic.py            L24 Name genai -> [('google.generativeai', IMPORT)];
                                            L14, L20, L28 resolve to nothing
    mock_target.py        every node     -> {} except the LOCAL `genai_mod` chain
    model_escapes.py      L10, L12       -> single IMPORT names
    class_attr.py         L10, L17       -> single IMPORT names
    two_configures.py     L8, L12, L20   -> single IMPORT names
    no_configure.py       L12            -> single IMPORT name

  Why every verdict here is `needs_review`. In several of these files one
  finding would be automatic on its own - the import rename in
  `model_escapes.py`, the `configure` rewrite in `class_attr.py`. They are
  recorded as `needs_review` because the edits are not independent: renaming
  `import google.generativeai as genai` to `from google import genai` while
  any `genai.GenerativeModel(...)` in the file survives produces a file that
  imports cleanly and then raises `AttributeError` on first use. That is
  ADR-010 F-1, and the file - not the import statement - is the atomic unit.

  Which code those rows name is ADR-012. Six of them (`model_escapes.py:8,10`,
  `class_attr.py:8,10`, `two_configures.py:4`, `no_configure.py:6`) originally
  carried the *other* group's bail: `model_object_escapes` on a line holding no
  model object, `client_source_unresolved` on a line needing no client. They now
  carry `file_not_fully_migrated` with `caused_by` naming the codes that actually
  fired, which is what `examples/gemini-legacy-app/ground_truth.yaml` already did
  for the identical shape. A seventh row, `model_escapes.py:22`, moved the other
  way for the same reason: its receiver is a function parameter, so the MODEL
  group's bail was never its own and `receiver_unresolved` is. No verdict moved.

  The five import rows that did NOT change - `alias_rebound.py:8`,
  `name_shadowed.py:9`, `conditional_import.py:10`, `dynamic.py:9`,
  `star_import.py:8` - are the contrast case: there the defect is in the
  binding the import itself creates, so the import's own code outranks
  atomicity. If Phase 1 decides to emit dual imports instead (ADR-010's
  strongest v0.2 candidate), this whole block is the assumption to revisit,
  deliberately.

  Two vocabulary claims this file used to get wrong, corrected against
  `docs/SCAN_VOCABULARY.md` section 2:

  1. `dynamic.py` reaches the SDK four ways and three of them are graded
     `dynamic_access`: line 14 `importlib.import_module(...)` and line 20
     `__import__(...)` are named verbatim by section 2, and line 28
     `sys.modules["google.generativeai"] = stub` is the stub form, which
     section 4 lists under `flag_only_surface` and which is recorded under the
     same reason because it is the same act - reaching the module by name at
     run time. The fourth form, line 24 `getattr(genai, ...)`, is NOT
     `dynamic_access`: it goes through the resolvable alias, so it is graded
     `module_alias_rebound` (C-05), which is why that row differs from the
     other three. This note previously claimed no member covered a dynamic
     import and that the rows used `string_or_comment_mention`; both were
     written before ADR-010 F-4 put the closed vocabularies in the repository,
     and neither matched the rows.
  2. A receiver bound at MODULE level and read inside a function
     (name_shadowed.py:24, star_import.py:18, model_escapes.py:26) is
     `receiver_bound_module_const`, which `docs/SCAN_VOCABULARY.md` section 2
     defines as "The receiver is a module-level constant, used inside a
     function or method of the same module", and which
     `../basic/ground_truth.yaml` uses for the identical shape. Those three
     rows originally read `receiver_bound_same_scope` because this note was
     written before ADR-010 F-4, when the member was not visible in the
     repository. The `bindings` entry's `kind: module_const` says the same
     thing about the binding itself. Spike case 14 used `receiver_unresolved`
     for a module global, but only because a `global` statement had rebound it,
     which is not the case here.

  Schema deviation, deliberate: each `bindings` entry carries a `file` key.
  The block in the assignment has no file field, which is unambiguous only in
  a one-file case; this directory has six binding-bearing files and three
  bindings all named `MODEL`. The key is additive, so a parser that reads only
  the specified fields is unaffected.

  The two files T4 added are the Phase 1 half of `COVERAGE.md` gap 10, and each
  pins one thing no other file here does. `two_assignments.py` separates
  `len(scope["model"]) > 1` from counting legacy constructors: only the first of
  its two assignments builds one, so a detector that counted constructors finds
  exactly one, calls the group closed-world, and rewrites line 20 - which may
  refer to whatever `registry.default_model()` returned. `local_import.py` is
  the only file in the oracle withheld by atomicity **alone**: its import
  resolves and binds cleanly, the two uses below it resolve through that alias,
  the module has one `configure` and D3 accepts it, and the file is still
  unwritable because v0 rewrites an import where it stands. Its constructor
  result is returned rather than bound on purpose - a binding there would have
  to be graded either `auto` in a file nothing may touch or with a code that
  `Binding` refuses, and choosing between those before the rule existed is the
  defect ADR-010 F-4 traces three fixture errors to. The rule is in
  `tests/unit/test_planner.py` instead, where inventing the answer is what a
  unit test is for.

  `alias_rebound.py` is the file to check first in any regression run. It is
  the one where a correct scanner and a broken scanner differ by the entire
  file: three real legacy call chains (lines 13, 17, 21) carry no legacy
  qualified name at all, and the only surviving trace is a two-token statement
  on line 11.

  `mock_target.py` line 13 is a documented MISS as well as a must-not-report.
  A patch through the application's own module path is invisible to a
  per-file scan, and C-57 measured exactly this: the one genuine miss in 320
  corpus files was a test file that patches through its own module and never
  contains the string `generativeai`. This file does contain the string, so it
  is scanned; a test file that used only line 13's form would not be.
