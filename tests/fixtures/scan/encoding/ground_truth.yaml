case: encoding
after_file_is: fix_apply_output
what_it_exercises: >-
  The byte-level cases from ADR-008 "Reading and writing files" (C-08, C-09, C-10): a file is read as
  bytes, parsed from bytes, gated on a byte round-trip, and compiled from bytes both before and after
  any edit -- so a CRLF file, a latin-1 file with a PEP 263 cookie, a UTF-8 BOM file and a file with no
  final newline all survive unchanged, while a bare-CR file is refused with roundtrip_mismatch and two
  files are refused with parse_error from opposite gates -- a Python 2 file libcst parses and compile()
  rejects, and a half-edited file libcst itself will not parse. Four of the seven files carry a
  `.after.py` answer key, so the output bytes are graded too, not only the input bytes; the three that
  do not are the three that must be left exactly as they are.

