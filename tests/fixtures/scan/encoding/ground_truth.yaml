  # ---- python2.py: C-08. One parse_error finding, nothing else. ----
  - file: python2.py
    line: 7
    symbol: "from __future__ import print_function"
    kind: parse_error
    confidence_reason: parse_error
    verdict: unsupported
    bail: input_does_not_parse
    note: >-
      `compile(data, path, "exec")` on the INPUT raises `SyntaxError: from __future__ imports must
      occur at the beginning of the file` at lineno=7, offset=1, observed identically on 3.12, 3.13
      and 3.14. libcst 1.9.0 parses the file without error and round-trips it byte-for-byte, so the
      compile() gate on the input is the only thing that refuses it (ADR-008 "Run compile() on the
      input as well as the output"). The file is emitted as `parse_error` and never edited; no usage
      findings and no bindings are emitted for it, which is why the legacy import and constructor
      appear under must_not_report instead. Coordinates come from `SyntaxError.lineno` (1-based);
      ParserSyntaxError would instead give `.raw_line`/`.raw_column`, and it is not a SyntaxError
      subclass. Re-derived for T38: the row was line 14, `except ValueError, e:`, which Python 3.14
      compiles (PEP 758), so the old key held on every interpreter but the newest.

  # ---- parser_syntax_error.py: C-08, the other branch. One parse_error finding. ----
  - file: parser_syntax_error.py
    line: 8
    symbol: '    model = genai.GenerativeModel("gemini-1.5-flash")'
    kind: parse_error
    confidence_reason: parse_error
    verdict: unsupported
    bail: input_does_not_parse
    note: >-
      `cst.parse_module(data)` raises `cst.ParserSyntaxError` with `raw_line=8`, `raw_column=4` and
      `editor_line=8`, `editor_column=5` (observed). This is the branch `python2.py` cannot reach:
      there libcst parses and only `compile()` refuses, here libcst refuses first and no tree is built
      at all, so nothing else about the file can be reported. Three rules meet in this one row.
      `cst.ParserSyntaxError` is **not** a `SyntaxError` subclass, so a handler spelled
      `except SyntaxError` lets it out and ends the run. The coordinates come from
      `.raw_line`/`.raw_column` and not from `.editor_*`, which are one greater in the column and
      would look plausible. And `compile()` on the same bytes raises
      `SyntaxError: '(' was never closed` at `lineno=6`, `offset=22` -- **two lines earlier**, where
      the bracket was actually left open -- so which number a report carries is decided by which gate
      runs first, which ADR-017 settles rather than leaving it to whichever exception is handy.
      `symbol` here is the source line at `line`, recorded the way `python2.py` records its own; the
      runtime must emit `symbol: null` and `evidence: null`, because a source excerpt is exactly what
      ADR-008 keeps out of the evidence -- and `cst.ParserSyntaxError.context`, which `str(exc)`
      renders, is this very line with a caret under it.

