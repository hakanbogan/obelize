must_not_report:
  - file: python2.py
    line: 6
    why: >-
      libcst 1.9.0 parses the misplaced `from __future__ import print_function` at line 7 and
      `print >>sys.stderr, x` (a right-shift inside a tuple, which is valid Python 3 syntax), so a
      scanner that gates only on `cst.ParserSyntaxError` sees a clean module and emits an auto-fixable
      import finding here -- on a file that is not a program. Only `compile()` on the input refuses it
      (C-08).
  - file: python2.py
    line: 8
    why: Same as line 6 -- a naive scanner emits an auto `configure` -> `Client` rewrite on a Python 2 file.
  - file: python2.py
    line: 17
    why: Same as line 6 -- a naive scanner emits an auto constructor rewrite on a Python 2 file.
  - file: python2.py
    line: 18
    why: Same as line 6 -- a naive scanner emits an auto `generate_content` rewrite on a Python 2 file.
  - file: parser_syntax_error.py
    line: 4
    why: >-
      The prefilter token `generativeai` is on this line, and the file yields **exactly one** finding
      -- the `parse_error` at line 8 -- so the legacy import must not be reported here as a
      `text_mention`. A scanner that runs the byte-level mention sweep independently of the parse gate
      emits one, which reads as "we looked at this file" for a file nothing could look at.
      SCAN_VOCABULARY.md section 7 states the rule: for a file that does not parse the kind and the
      reason are the same fact, "because such a file yields exactly one finding and there is nothing
      else to say about it".
  - file: _build.py
    line: 71
    why: >-
      `_build.py` is the generator for this directory, not a scan input. Its byte literals contain the
      text `import google.generativeai as genai` six times, the first at this line, which a scanner
      pointed at this directory would report as `text_mention`. The harness must exclude `_build.py`
      from the corpus for this case -- and the four `*.after.py` answer keys with it, under the same
      rule that already excludes `basic/app.after.py` and `chat_async_self/assistant.after.py`. An
      answer key is what the tool must produce, never something it is pointed at.
      The line number moves whenever the generator is edited, which it silently did when the answer
      keys were added and again when `parser_syntax_error.py` was added;
      `tests/unit/test_fixture_encoding.py` asserts it points at the literal, and caught the second
      drift.

# Not a `must_not_report`: these lines ARE reported. They must never be EDITED.
# The two keys are separate so a harness can read `must_not_report` as "assert no
# finding here" without tripping over a row that means the opposite (ADR-010 F-5).
must_not_autofix:
  - file: bare_cr.py
    line: 2
    why: >-
      Not "must not report" but "must not auto-fix": the findings here are real and are reported, and
      the verdict must be needs_review, never auto. A scanner that omits the round-trip gate emits a
      clean four-finding auto plan and, on apply, silently drops the file's final `\r` byte (C-09).

notes: |
  GENERATOR. `_build.py` in this directory writes all seven fixtures from explicit byte literals via
  `pathlib.Path.write_bytes`, and re-verifies them. Re-run it from the repository root after any
  change; never edit these seven files in an editor, which would normalise the very bytes under test:

      uv run python tests/fixtures/scan/encoding/_build.py            # write, then verify
      uv run python tests/fixtures/scan/encoding/_build.py --check    # verify only

  OBSERVED, not predicted. Measured on 2026-09-17 with libcst 1.9.0 (native Rust parser) on
  CPython 3.12.9, macOS arm64 -- the same libcst version ADR-008 is tied to. The python2.py row
  was re-measured on 2026-09-24 (T38) on 3.12.9, 3.13.5 and 3.14.7, with the same answer on each. `roundtrip` is
  `cst.parse_module(data).bytes == data`; `compile` is `compile(data, name, "exec")` on the bytes.

  | file | bytes | module.encoding | roundtrip | compile(bytes) |
  |---|---|---|---|---|
  | crlf.py | 266 | 'utf-8' | True | ok |
  | latin1_cookie.py | 361 | 'iso-8859-1' | True | ok |
  | utf8_bom.py | 268 | 'utf-8-sig' | True | ok |
  | bare_cr.py | 202 | 'utf-8' | **False** (1 byte lost) | **ok** |
  | python2.py | 549 | 'utf-8' | True | **SyntaxError** |
  | parser_syntax_error.py | 303 | n/a | **libcst refuses** | **SyntaxError** |
  | no_trailing_newline.py | 233 | 'utf-8' | True | ok |

  The three refusals are the point of the directory, and no two of them fail the same way:

  - `bare_cr.py` -- round-trip False, compile True. `b'...text)\r'` comes back as `b'...text)'`:
    libcst drops the final byte and `compile()` accepts the damaged result, so nothing downstream
    notices. The round-trip gate is the only defence (C-09), and the bail code is `roundtrip_mismatch`.
  - `python2.py` -- round-trip True, compile False. libcst parses it happily; `compile()` on the
    input is what rejects it, at line 7, the misplaced `__future__` import (C-08). Re-measured for
    T38 on 3.12, 3.13 and 3.14; it was line 14, `except ValueError, e:`, which 3.14 compiles.
  - `parser_syntax_error.py` -- no tree at all. `cst.parse_module` raises `cst.ParserSyntaxError`
    (`raw_line=8`, `raw_column=4`; `editor_line=8`, `editor_column=5`), so there is no `.bytes` to
    compare and no round-trip column to fill in -- which is why `_build.py` grades this one file from
    its own table rather than from `EXPECTED`. `compile()` refuses the same bytes and blames
    `lineno=6`: the bracket was left open there, and libcst stopped two lines later. Added for
    COVERAGE.md gap 15; the gate order that decides which of the two numbers is reported is
    ADR-017 D1.

  libcst treats a bare CR as a line terminator: for `bare_cr.py`, `PositionProvider` reports lines
  1, 2, 4, 5, 6 for the statements, even though `cat -n` shows the file as one line. Every line number
  in this file was read back from `PositionProvider` on the written bytes, not counted by hand.

  The latin-1 case is what forces bytes-in/bytes-out. Parsed from `str`, libcst reports
  `encoding='utf-8'` and ignores the cookie, so `.bytes` no longer matches the original; and
  `read_text(encoding="utf-8", errors="replace")` destroys `ENTETE` on line 9 outright. Parsed from
  bytes, the encoding is reported as `iso-8859-1` and the round-trip is exact.

  The BOM case is the mirror image: `compile()` on the BOM *bytes* succeeds, while `compile()` on a
  `str` that starts with U+FEFF fails with `invalid non-printable character U+FEFF`. Feed `compile()`
  `module.bytes`, never a str.

  Every fixture except `bare_cr.py`, `python2.py` and `parser_syntax_error.py` holds exactly one
  `configure(...)` call, so D3's module-wide ClientSource resolves and the call rewrites can be
  `auto`. That is deliberate: it keeps these seven cases about bytes and nothing else. Client-source
  and binding bails are exercised by the other scan fixture directories.
  `parser_syntax_error.py` has no `configure(...)` at all -- it has the `genai.Client(...)` somebody
  was in the middle of writing instead -- and that is not a client-source case either, because a file
  with no tree is never asked the question.

  ANSWER KEYS, added by ADR-013. Four of the six files now carry a `.after.py`, generated by the same
  `_build.py` from byte literals: `crlf.after.py`, `latin1_cookie.after.py`, `utf8_bom.after.py` and
  `no_trailing_newline.after.py`. `bare_cr.py`, `python2.py` and `parser_syntax_error.py` deliberately
  have none, and under `after_file_is: fix_apply_output` that absence is a claim in its own right --
  those three files must come out of `obelize fix --apply` byte-identical to how they went in.

  Until this was written the directory pinned its inputs and said nothing about its outputs, while
  grading sixteen findings `auto`. Four files that exist to prove bytes-in/bytes-out had no evidence
  that anything comes out: nothing checked that a migrated CRLF file still emits `\r\n`, that the
  latin-1 file is re-encoded with its cookie's encoding rather than the platform default, that the
  BOM survives, or that the unterminated file stays unterminated.

  The keys grade two different things, and they are worth separating because they have different
  lifetimes:

  - **The byte shape** -- terminator, PEP 263 cookie, BOM, final newline. `_build.py`'s `PAIRS` and
    `byte_shape()` assert it directly from the bytes, input against output, and
    `tests/unit/test_fixture_encoding.py` runs the same comparison in the ordinary matrix. This is
    what the directory exists for and it does not depend on any layout decision.

    | file | terminator | cookie / BOM | final newline |
    |---|---|---|---|
    | crlf | CRLF | -- | yes |
    | latin1_cookie | LF | `# -*- coding: latin-1 -*-` | yes |
    | utf8_bom | LF | UTF-8 BOM | yes |
    | no_trailing_newline | LF | -- | **no** |

  - **The Python** -- which is inherited, not decided here. `import ... as genai` becomes
    `from google import genai`; the module-level `configure` becomes `client = genai.Client(...)`;
    the `GenerativeModel` statement is deleted and the model name folded into the call; a call that
    was one line stays one line. Those are `basic/ground_truth.yaml` notes 2 and 4, and when that
    layout rule is rewritten as an algorithm before T10 these four keys move with it. No `types`
    import is added to any of them, because none references `types.*`.

  All four keys are at most 97 characters wide, inside the project's own `line-length = 100`, so
  unlike `chat_async_self/assistant.after.py` they are not exposed to the hazard that a user's
  `ruff format` would rewrap what the codemod emitted.

  THE FOUR CONFIGURE ROWS NOW CARRY `client_constructed_eagerly` (ADR-013). Each is a module-level
  `configure(api_key=os.environ.get("GEMINI_API_KEY", ""))`, so after the rewrite the client is built
  at import time from a value that is `""` whenever the variable is unset, and
  `genai.Client(api_key="")` raises. ADR-010 F-6 makes the warning mandatory for exactly this shape
  and the rows were missing it; the warning does not withhold a hunk, so the answer keys above are
  unaffected.

  No `expected.json` here on purpose: the Finding JSON schema does not exist until Phase 1 task T3.
  This file records the semantic facts; T3's harness translates them.

  THE T3 REVISIT THIS FILE ASKED FOR HAS HAPPENED, and the answer went both ways. The note here used
  to say that two codes were recorded as a `confidence_reason` with nothing settling whether they
  belonged there -- `roundtrip_mismatch`, which PACK_SPEC's table calls a *bail*, and `parse_error`,
  described as something the scanner *emits*. Both are now decided, differently:

  - `roundtrip_mismatch` is **not** a reason. ADR-010 F-5 split the two fields, and the four
    `bare_cr.py` rows carry `confidence_reason: alias_resolved` with the refusal in `bail`, which is
    what the note on line 2 records. It is absent from the reason vocabulary in
    `src/obelize/models.py`, so a row that wrote it there now fails
    `tests/unit/test_fixture_vocabulary.py`.
  - `parse_error` **is** both, on purpose, and SCAN_VOCABULARY.md section 7 is where that is written
    down and asserted: "the finding kind and the reason are the same fact, because a file that does
    not parse yields exactly one finding and there is nothing else to say about it". Two rows use it
    that way -- `python2.py:7` and `parser_syntax_error.py:8` -- and `obelize.models.Finding`
    enforces the biconditional, so one of the two fields cannot be set without the other.

  The equivalent gap on the manifest side is recorded in
  examples/gemini-legacy-app/ground_truth.yaml.
