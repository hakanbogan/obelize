[project]
name = "manifests-fixture"
version = "0.1.0"
description = "Helpers around google-generativeai, pinned four different ways."
dependencies = [
  # the declaration is the line below, not this one: "Google_GenerativeAI==0.8.6"
  "Google_GenerativeAI==0.8.6",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.poetry.group.test.dependencies]
google-generativeai = "^0.8.6"
pytest = "^8.3"

[tool.uv]
dev-dependencies = [
  # "google-generativeai==0.8.6"
  "google-generativeai==0.8.6",
]

[tool.pdm.dev-dependencies]
lint = ["google-generativeai==0.8.6"]

[tool.hatch.envs.default]
dependencies = ["google-generativeai==0.8.6"]

[tool.hatch.envs.default.scripts]
lock = "pip install google-generativeai==0.8.6"

[tool.poetry.dev-dependencies.google-generativeai]
version = "^0.8.6"
