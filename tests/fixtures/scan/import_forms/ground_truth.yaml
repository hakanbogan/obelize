case: import_forms
after_file_is: none
what_it_exercises: >-
  Every spelling of the legacy import other than `import google.generativeai as
  genai`, which the other five cases use exclusively, plus the two annotation
  forms, and one file whose model and function are named outside ASCII.
  Before this case `direct_import_resolved` and `from_import_resolved`
  had zero uses anywhere in the oracle and C-26 -- a string annotation is a real
  finding and not a prose mention -- had no positive case at all. It carries no
  `.after.py`: the layout algorithm that would decide the bytes is the one
  ADR-010 F-4 names as unwritten, and a key no rule can produce is a claim no
  test can check.

findings:
  # =====================================================================
  # plain_dotted.py -- `import google.generativeai`, spelled out at each
  # call site. The one form with no alias to rename, and the reason the
  # rewrite rule needs an `alias_collision` bail of its own: it has to
  # introduce a name that was not there before.
  # =====================================================================
  - file: plain_dotted.py
    line: 9
    symbol: google.generativeai
    kind: import
    confidence_reason: direct_import_resolved
    verdict: auto
    note: >-
      `import google.generativeai` -> `from google import genai`, and every
      `google.generativeai.X` below becomes `genai.X`. Verified resolution of
      the middle `Attribute` on line 11: [('google.generativeai', IMPORT)]; the
      *inner* `Name google` resolves to [('google', IMPORT)] and is rejected by
      the prefix test rather than the source test (spike QNP case 2), which is
      why it appears under `must_not_report`.
  - file: plain_dotted.py
    line: 11
    symbol: google.generativeai.configure
    kind: call
    confidence_reason: direct_import_resolved
    verdict: auto
    warnings: [client_constructed_eagerly]
    note: >-
      The module's single `configure(...)`, so it is this module's ClientSource
      under D3. At module level, so the rewritten `genai.Client(...)` runs at
      import time and ADR-010 F-6 makes the warning mandatory.
  - file: plain_dotted.py
    line: 15
    symbol: google.generativeai.GenerativeModel
    kind: call
    confidence_reason: direct_import_resolved
    verdict: auto
    note: >-
      One positional argument, so C-22's positional-order hazard does not
      arise. The object has no counterpart in google-genai: the statement goes
      and the model name folds into the call below.
  - file: plain_dotted.py
    line: 16
    symbol: google.generativeai.GenerativeModel.generate_content
    kind: method_call
    confidence_reason: receiver_bound_same_scope
    verdict: auto
    note: >-
      Receiver `model` is bound on line 15 in this same function scope, and its
      one reference is the receiver of a supported method, so the closed world
      holds.

  # =====================================================================
  # from_import.py -- `from google.generativeai import X [as Y]`. Two
  # statements, because the renamed and un-renamed forms resolve through
  # different local names and each has to be looked up by the name it is
  # spelled with.
  # =====================================================================
  - file: from_import.py
    line: 9
    symbol: google.generativeai
    kind: import
    confidence_reason: from_import_resolved
    verdict: auto
    note: >-
      `from google.generativeai import GenerativeModel as Model`. The symbol is
      the module rather than `...GenerativeModel`, because the rewrite is one
      statement: `from X import a, b` is a single finding about X and not one
      per imported name.
  - file: from_import.py
    line: 10
    symbol: google.generativeai
    kind: import
    confidence_reason: from_import_resolved
    verdict: auto
    note: >-
      The second statement, importing `configure` under its own name. Two
      findings on two lines with the same symbol is correct here and is what a
      scanner keyed on "one import finding per module" would collapse.
  - file: from_import.py
    line: 12
    symbol: google.generativeai.configure
    kind: call
    confidence_reason: from_import_resolved
    verdict: auto
    warnings: [client_constructed_eagerly]
    note: >-
      Resolved through the bare name `configure`, which is the form that has no
      module alias anywhere in the expression. Module level, so F-6's warning
      applies as it does in `plain_dotted.py`.
  - file: from_import.py
    line: 14
    symbol: google.generativeai.GenerativeModel
    kind: call
    confidence_reason: from_import_resolved
    verdict: auto
    note: >-
      Spelled `Model(...)`, and resolved because the import renamed it: libcst
      returns [('google.generativeai.GenerativeModel', IMPORT)] for the `Name`
      (spike QNP case 4). The `confidence_reason` follows the *import form*,
      not the local spelling.
  - file: from_import.py
    line: 18
    symbol: google.generativeai.GenerativeModel.generate_content
    kind: method_call
    confidence_reason: receiver_bound_module_const
    verdict: auto
    note: >-
      `DEFAULT` is bound at module level and read inside a function, which is
      what separates `receiver_bound_module_const` from
      `receiver_bound_same_scope` -- the same binding read at module level is
      the latter (`../encoding/bare_cr.py:6`).

  # =====================================================================
  # from_google.py -- C-27. `from google import generativeai` resolves
  # perfectly and matched no rule in the original plan, which is the
  # "resolved, yet nothing fires" case.
  # =====================================================================
  - file: from_google.py
    line: 10
    symbol: google.generativeai
    kind: import
    confidence_reason: from_import_resolved
    verdict: auto
    note: >-
      `from google import generativeai` -> `from google import genai`, plus
      rewriting every `generativeai.Y` to `genai.Y`, with the same
      `alias_collision` bail as the plain dotted form. The module is named in
      the imported symbol rather than in the `from` clause, so a scanner that
      reads only `statement.module` sees `google` and reports nothing.
  - file: from_google.py
    line: 12
    symbol: google.generativeai.configure
    kind: call
    confidence_reason: from_import_resolved
    verdict: auto
    warnings: [client_constructed_eagerly]
