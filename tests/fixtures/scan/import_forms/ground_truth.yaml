    verdict: auto

  # =====================================================================
  # annotations.py -- C-26, and the gap the correction is most likely to
  # be implemented backwards in. Both annotation forms resolve, through an
  # import that never executes.
  # =====================================================================
  - file: annotations.py
    line: 12
    symbol: google.generativeai.types
    kind: import
    confidence_reason: from_import_resolved
    verdict: auto
    note: >-
      An import inside `if TYPE_CHECKING:`. It is a real legacy import and is
      rewritten like any other; it is NOT `conditional_binding`, which is the
      try/except double-import shape where one node carries two IMPORT
      qualified names. Verified: the annotations below resolve to a single
      IMPORT name.
  - file: annotations.py
    line: 17
    symbol: google.generativeai.types.GenerationConfig
    kind: attribute
    confidence_reason: from_import_resolved
    verdict: auto
    note: >-
      A bare-name annotation, deferred by `from __future__ import annotations`.
      C-03: the name becomes `GenerateContentConfig`, never the new SDK's
      identically named `types.GenerationConfig`, so this row is a real edit
      and not a no-op.
  - file: annotations.py
    line: 22
    symbol: google.generativeai.types.GenerationConfig
    kind: attribute
    confidence_reason: from_import_resolved
    verdict: auto
    note: >-
      The string form, on a return annotation. Verified: the `SimpleString`
      node itself resolves to
      [('google.generativeai.types.GenerationConfig', IMPORT)] -- libcst
      resolves forward references, including through a `TYPE_CHECKING` guard
