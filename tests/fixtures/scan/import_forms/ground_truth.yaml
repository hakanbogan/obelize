  # =====================================================================
  - file: types_submodule.py
    line: 9
    symbol: google.generativeai
    kind: import
    confidence_reason: alias_resolved
    verdict: auto
    note: >-
      The aliased form, here so that one file carries two import statements
      resolving under two different reasons. `alias_resolved` for the uses
      through `genai`, `from_import_resolved` for the uses through the names
      line 10 binds.
  - file: types_submodule.py
    line: 10
    symbol: google.generativeai.types
    kind: import
    confidence_reason: from_import_resolved
    verdict: auto
    note: >-
      The symbol is `google.generativeai.types`, the module the statement
      actually names -- not the top-level `google.generativeai`. PACK_SPEC's
      `rename_import.submodule_map` maps it to `google.genai.types`, so the
      rewrite needs to know which of the two it is looking at.
  - file: types_submodule.py
    line: 12
    symbol: google.generativeai.configure
    kind: call
    confidence_reason: alias_resolved
    verdict: auto
    warnings: [client_constructed_eagerly]
  - file: types_submodule.py
    line: 14
    symbol: google.generativeai.types.HarmCategory.HARM_CATEGORY_HATE_SPEECH
    kind: attribute
    confidence_reason: from_import_resolved
    verdict: auto
    note: >-
      An enum member, which SCAN_VOCABULARY.md section 1 names as one of the
      two things a `kind: attribute` finding is. Verified: libcst resolves the
      whole path, [('google.generativeai.types.HarmCategory.HARM_CATEGORY_HATE_SPEECH',
      IMPORT)] (spike QNP case 5), while the inner `Name HarmCategory` resolves
      to the class and is suppressed as a link of the same chain.
      `auto` here does NOT mean a hunk begins on this line: `HarmCategory` maps
      to itself in `symbol_map`, so the member reads identically after the
      migration and the group's only textual change is the import on line 10.
      A verdict grades what happens to the usage, not where the diff lands --
      `../basic/app.py:9` is `auto` and its edit is a deletion.
  - file: types_submodule.py
    line: 14
    symbol: google.generativeai.types.HarmBlockThreshold.BLOCK_ONLY_HIGH
    kind: attribute
    confidence_reason: from_import_resolved
    verdict: auto
    note: >-
      The second member on the same line, with a different symbol. Two findings
      on one line is the shape the `must_not_report` schema's `symbol` key
      exists for, and a scanner that keys findings by (file, line) alone loses
      one of them.
  - file: types_submodule.py
    line: 23
    symbol: google.generativeai.GenerativeModel
    kind: call
    confidence_reason: alias_resolved
    verdict: auto
    note: >-
      Deliberately bare of `safety_settings=`: `STRICT` is a module constant
      this file hands to its own caller, and passing it to the constructor
      would make the group bail `safety_settings_not_static`, which is a
      Phase 2 verdict with no fixture behind it (COVERAGE.md gap 6).
  - file: types_submodule.py
