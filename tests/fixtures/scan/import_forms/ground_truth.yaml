must_not_report:
  - file: plain_dotted.py
    line: 11
    symbol: google
    why: >-
      The inner `Name google` on the `configure` line resolves to
      [('google', IMPORT)]. It is an IMPORT from a real import statement, so
      the `source == IMPORT` half of the rule does not reject it -- the module
      prefix does. That is the same guard that keeps `../negative/local_genai`
      out of the report, measured from the other direction.
  - file: from_import.py
    line: 21
    why: >-
      `def generate_content(question)` is this module's own function. It shares
      a name with the legacy method and resolves to this module, not to any
      legacy receiver. The unresolvable-receiver sweep keys on the method name,
      so a definition -- or a call with no receiver in front of it -- is exactly
      what it must not match. Same shape as `../basic/app.py:20`.
  - file: from_google.py
    line: 5
    why: >-
      The docstring names the distribution `google-generativeai` with a hyphen.
      It trips the byte prefilter, which is the prefilter working, and it is not
      an importable path, so it is not a `text_mention` either. Four other
      fixtures carry the same decoy; this is the one in a file whose import
      spelling is the closest thing to it.
  - file: types_submodule.py
    line: 18
    why: >-
      `dict(STRICT)` copies this module's own table. `STRICT` is not a legacy
      binding: its value is a dict literal, not a constructor call, and the
      requirement that the constructor resolve is what keeps a binding pass
      from inventing a group around any name whose value merely mentions the
      SDK.
  - file: annotations.py
    line: 9
    why: >-
      `from typing import TYPE_CHECKING` sits in the same file and
      `TYPE_CHECKING` resolves to [('typing.TYPE_CHECKING', IMPORT)]. An
      implementation keyed on "an import inside an `if`", or on any resolved
      IMPORT name rather than on the legacy prefix, reports it.
  - file: annotations.py
    line: 14
    why: >-
      `FALLBACK = "GenerationConfig"` is the inverse of C-26 and the reason
      COVERAGE.md called this gap the one most likely to be implemented
      backwards. Verified: the same characters in a non-annotation position
      resolve to an empty set, so there is nothing to report as an
      `attribute` -- and they are not the dotted module path, so
      `string_or_comment_mention` does not fire either. A scanner that swept
      annotations into string matching would report this line and miss lines 17
      and 22; one that string-matched the bare class name would report all
      three.

notes: |
  There is no `.after.py` in this directory and `after_file_is` is `none`. Every
  finding here is `auto`, which under `fix_apply_output` would demand a key per
  file; the case deliberately grades its inputs only, for the reason ADR-018
  gives for the pack's own fixtures -- the layout algorithm that decides the
  bytes is unwritten, and the `basic` and `chat_async_self` keys are the two the
  Phase 2 rewrite of layout rule 4 has to reproduce first.

  Every resolution claim above was measured with libcst 1.9.0's
  `QualifiedNameProvider` and `ScopeProvider` over these exact files
  (`MetadataWrapper(module, unsafe_skip_copy=True)`), and every line number was
  checked against `cat -n`. All five files round-trip byte-identically and pass
  `compile()`, so none of them is confounded by `roundtrip_mismatch` or
  `parse_error`.

  Why every verdict is `auto`. Each file has exactly one `configure(...)`, so
  D3's module-wide ClientSource resolves; each binding has one constructor and
  one reference, and that reference is the receiver of a supported method; and
  nothing in any of the five files is withheld, so ADR-010 F-1's atomicity has
  nothing to withhold the import rewrites for. That is what makes this case the
  contrast to `../escapes/`, which is the same five shapes with one thing broken
  in each.

  What this case does NOT add. It contains no `alias_collision` and no
  `alias_fallbacks` -- a module that already binds `types` or `genai` --
  and it never will: those are rewrite-path bails, and the harness grades a
  fixture verdict as a **scan** status, so a row claiming one here would assert
  that `obelize scan` reports it. T10 added them as `module_alias_taken.py` and
  `types_name_taken.py` under `tests/fixtures/transforms/rename_import/`, built
  on the un-aliased and submodule shapes this case pins, because those are the
  two whose rewrite has to introduce a name. COVERAGE.md gap 8 is struck
  through there.
