case: chat_async_self
after_file_is: fix_apply_output
what_it_exercises: The shapes that decide whether v0 is useful - a self_attr binding (D2) whose client comes from a configure() inside a method (D3), a positional safety_settings argument (C-22), a literal chat history with string parts (C-01), the send_message argument rename (C-17), sync streaming, non-streaming async, and async streaming whose await must survive the method rename (C-18) - plus an unrelated class that also stores something on self.model.
