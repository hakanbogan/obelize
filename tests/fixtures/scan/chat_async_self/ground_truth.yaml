notes: |
  Byte-for-byte target output is `assistant.after.py`, and after ADR-010 that statement is exact:
  nothing in this fixture bails, every finding is `auto`, so `after_file_is: fix_apply_output` and
  `obelize fix --apply` must produce this file byte for byte. Three findings carry warnings
  (lines 13, 32 and 46) - a warning is printed with the edit and recorded in REPORT.md; it does not
  withhold the hunk, which is what `needs_review` does. `assistant.after.py` compiles under CPython.

  This file was originally written with lines 13, 32 and 46 graded `needs_review` while the after
  file was a complete migration, which is the contradiction ADR-010 F-5 removes: `needs_review`
  never emits a hunk. Resolving it in the other direction - keeping the three verdicts and marking
  the after file a human answer key - would have meant a single `async for` made the entire class
  manual, via the binding group (ADR-006) and then the file (F-1). That is the right behaviour when
  a rewrite really is unverified; it is the wrong price for two rules whose facts were measured.

  The layout rule used to write the answer key is stated in `../basic/ground_truth.yaml` and applies
  here too. It is why `answer()` - a one-line call in the source - comes back multi-line: one of its
  emitted arguments (the `safety_settings` list) is multi-line, and it is why the preserved `history`
  list keeps its own indentation and element layout byte for byte.

  Decisions taken while writing the answer key, each one a place where ADR-008 constrains the result
  without spelling out the exact bytes:

  1. **`self.client`, not `client`.** The plan's naming rule (`client` -> `genai_client` -> bail
     `client_name_collision`) is written for a module-level or same-scope client. Here D3 resolves
     the ClientSource to a `configure()` inside `__init__` while the uses are in five OTHER methods,
     so a local `client` would be a `NameError` at the first call site. C-30's own recommendation is
     phrased as "`configure()` in any method of the class that also holds the `self_attr` binding",
     which only produces working code if the client lands on the instance. `self.client` is that
     realisation; on a collision the same ladder would give `self.genai_client`. This is the single
     largest inference in the answer key and is the thing to overrule first if it is wrong.
     **Ratified, not overruled:** T11 wrote the placement table down as
     [ADR-026](../../../../docs/adr/ADR-026-client-placement-layout.md) D3 and
     `configure_to_client` implements it, so line 13 of the key is now produced by a rule rather
     than inferred by an author -- and the collision it predicts is the same one, with `self.` in
     front of both rungs. `tests/fixtures/transforms/configure_to_client/self_attr.before.py` is
     this shape reduced to what one rule owns.
  2. **The constructor's config is duplicated into all five call sites.** `GenerativeModel` has no
     counterpart, so the statement is deleted and both the model name and the constructor config
     (`system_instruction` + `safety_settings`) fold into every call, per "generation_config= (ctor
     or call) -> config= on the same call". The output is repetitive; hoisting a shared
     module-level or instance-level `GenerateContentConfig` would read far better but is not
     sanctioned by ADR-008, so it is not in the answer key. Worth revisiting before Phase 1 T3:
     five copies of an eight-line config is what the demo diff will look like.
     **Revisited and ratified, three tasks later than this note asked**
     ([ADR-027](../../../../docs/adr/ADR-027-model-object.md) D2).
     Hoisting needs two things no rule here has: a name the author never wrote, which no pack
     parameter offers and ADR-006 does not let a rule invent, and a scope to put it in -- the
     problem ADR-026 D3 needed a four-row table and a new bail to answer for the client, with a
     `configure(...)` call to anchor the answer to. There is no anchor here, because the
     constructor is the thing being deleted. What did change in the meantime is that the width
     clause makes the repetition visible in the diff instead of hidden inside one very wide
     line, so the cost is countable: it is a v0.2 candidate beside dual imports, not a defect.
  3. **Safety values are emitted as enum member accesses**, `types.HarmCategory.HARM_CATEGORY_X` /
     `types.HarmBlockThreshold.BLOCK_X`, not as strings. PACK_SPEC's map values are named as
     "`types.HarmCategory` member", and C-02 is the reason to prefer the attribute form: a wrong
     STRING is fabricated at runtime by `CaseInSensitiveEnum._missing_` with only a
     `warnings.warn`, while a wrong attribute raises `AttributeError` at first use. Obelize still
     validates the names statically against `__members__`, because the SDK will not.
  4. **`chats.create` gets the same `GenerateContentConfig`.** The new chat surface takes
     `client.chats.create(model=..., history=..., config=...)`, `config` being a
     `GenerateContentConfig`, so the constructor's system instruction and safety settings reach the
     chat the same way they reach `generate_content`. `send_message` itself carries no config here.

  6. **T12 deliberately left this file alone; T13 produces it.** `generative_model_calls` landed
     with the model constructor, `generate_content` and the configuration, and this file's model is
     read through `start_chat` and `send_message` as well -- methods the pack declared for the scan
     and gave no rewrite for. The binding group is atomic, so the whole group was refused
     `receiver_method_unmapped` and the file came back with its client and nothing else (ADR-027
     D7), which `tests/oracle/test_generative_model_calls_against_the_oracle.py` asserted so that a
     change half-writing this file would fail there rather than here.
     **Produced by rule since T13**
     ([ADR-028](../../../../docs/adr/ADR-028-chat-surface-async.md)). The same test
     now asserts these bytes and these nine edits, including the three warnings this file grades:
     the positional safety table on line 13, the reshaped history on line 32 and the `await` that
     survives the async streaming rename on line 46. Every decision numbered here was made before
     any rule existed and the only one that moved is note 5's rewrapping, which was T11's and is
     recorded there.

  5. **Fifteen lines of this key were rewrapped by T11**, and it is worth saying why the bytes of
     an answer key moved at all. `basic/ground_truth.yaml` note 4 stated the layout rule in Phase 0
     and gave it no width clause, so the three `types.SafetySetting(...)` lines in each of the five
     call sites were emitted on one line each, at 146, 154 and 148 columns. Note 4 became an
     algorithm in T11 (ADR-026 D7) and it has a width clause now, read from the pack's
     `layout.line_length`, so those lines break: one argument per line, one indent unit past the
     call, trailing comma. Nothing else about the key changed, and no verdict did --
     `tests/unit/test_fixture_vocabulary.py`'s census is over findings and this file has the same
     ones it had. The rule that will *produce* these bytes is still T13's; what T11 fixed is a key
     that contradicted the algorithm the repository had just written down.

  Two things a reviewer of ADR-008 should know, found while writing this fixture:

  - **C-18's example is not runnable legacy code.** ADR-008 writes the legacy shape as
    `async for x in model.generate_content_async(p, stream=True)`, with no `await`, and describes
    the fix as an INSERTED `await`. In google-generativeai 0.8.6 `generate_content_async` is a
    coroutine function whatever `stream` is, so that form raises
    `TypeError: 'coroutine' object is not async iterable` before any migration: real legacy code
    reads `async for x in await model.generate_content_async(p, stream=True)`, which is what line 46
    of `assistant.py` contains. The substance of C-18 is unchanged and this fixture still pins it,
    from the other side: the `await` must be PRESENT in the output. The hazard is an implementation
    that derives the async streaming rewrite from the sync one (line 28, no await anywhere) and
    emits `async for chunk in self.client.aio.models.generate_content_stream(...)`, which fails at
    runtime exactly as the ADR predicts. **Acted on:** ADR-010 F-8 corrects C-18 to "preserved when
    present, bail when absent" and regrades the branch `auto`. Both coroutine facts and the
    `TypeError` were reproduced against the installed 0.8.6 and 2.23.0 before the ADR was written.
  - **The closed vocabularies were not in the repository.** **Acted on:** they are now, in
    `docs/SCAN_VOCABULARY.md` (ADR-010 F-4). This fixture only needs the attested
    `receiver_bound_self_attr` and `receiver_bound_same_scope`.
