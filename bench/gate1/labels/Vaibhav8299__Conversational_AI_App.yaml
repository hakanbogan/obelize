what_it_is: 'A multilingual voice assistant kept as five near-identical copies of one script
  -- `3.py`, `4.py`, `5.py`, `app.py` and `s3.py` -- which is why it carries twenty of the
  sixty-four actionable sites in the five keys and only one distinct shape. It is in the sample
  because that is what the frame returned, and because its `requirements.txt` is the best
  manifest trap in the five: the legacy distribution is declared once for real and three times
  in comments, one of those pinned, and `langchain-google-genai` is declared beside it in
  two manifests.'
