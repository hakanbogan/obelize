notes: 'Twenty actionable sites, one shape. Every file has a single `configure`, a model built
  and used inside one function and no escape, so all five are expected to be zero-bail --
  and F-2 then expects the new pin in both manifests. The interesting half of this key is
  what must **not** come back: six positions, four of them in a manifest.'
