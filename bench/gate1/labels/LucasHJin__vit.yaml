expected_other:
  - path: setup.py
    line: 10
    kind: manifest
    symbol: google-generativeai
    note: >-
      `install_requires` in a `setup.py`, unpinned. The same file declares
      `python_requires=">=3.8"` on line 8, which admits an interpreter the new
      distribution does not install on -- but `scan/runtime.py` deliberately does
      not read `setup.py`, because it is code, so no `runtime_unsupported` is
      expected here. This repository is the first real instance of that gap.
must_not_report:
  - path: vit/ai_merge.py
    line: 305
    why: >-
      The hyphenated distribution name in an error message. ADR-019's third
      detection rule: the hyphenated name is never a source finding.
  - path: vit/ai_merge.py
    line: 428
    why: The same message in the second function, hyphenated twice on one line.
  - path: tests/test_ai_merge.py
    line: 263
    why: >-
      `@patch("vit.ai_merge._get_genai_model")` patches this repository's own
      factory, not a legacy symbol, so it is not a `mock_patch_target`. Nine more
      of these appear in the same file and none of them is a legacy usage.
notes: >-
  Thirteen actionable sites, seven of them a `generate_content` -- and six of
  those seven have a receiver that came out of a local factory, the row notes
  above say which. If a static resolver cannot follow a function
  return -- and ADR-008 D3 says it does not -- this repository is where that
  costs the most recall in the sample, which is why it is worth having in it.
