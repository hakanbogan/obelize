what_it_is: >-
  A version-control tool for video editing timelines. The Gemini surface is one
  module, `vit/ai_merge.py`, which reaches it twice and through two different
  shapes: a private factory that imports, configures and constructs a model and
  hands it back, and one function that does all three inline.
