    line: 113
    why: >-
      `client.chat.completions.create(...)` where `client` is annotated `OpenAI`.
      The same name is a Gemini `ChatSession` eight lines further down, so a
      resolver that keys on the name rather than on the binding reports this.
  - path: utils.py
