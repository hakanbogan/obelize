      `client` passed on to the OpenAI helper, in a function with no Gemini object
      at all.
notes: >-
  Nine actionable sites across two files, and the two that matter most for the
  measurement are lines 123 and 124: the whole chat surface in this repository
  is reached through a parameter. The file also cannot be fully migrated whatever
  happens, because `make_gemini_client` returns the chat -- so under ADR-010 F-1
  neither `utils.py` nor, through the repository-wide rule, its manifest line is
  expected to be migratable.
