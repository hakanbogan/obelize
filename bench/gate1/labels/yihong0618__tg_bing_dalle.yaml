license: MIT
labeller: Hakan Bogan
labelled_at: '2026-09-18'
what_it_is: >-
  A Telegram bot with four providers behind it, of which Gemini is one. It is
  the only repository in the five that uses the **chat** surface, and the census
  in `spikes/FINDINGS.md` says chat is more common in real code than
  `generate_content` -- so a sample without one would be a sample about the
  wrong surface. It also contains the sharpest false-positive trap of the five:
  the name `client` is a Gemini `ChatSession` in one function of `utils.py` and
  an `openai.OpenAI` in another.
files_read:
