  - path: bot.py
    line: 5
    kind: import
    symbol: google.generativeai
    label: manual
    why: Withheld with the rest of the file. The import cannot be rewritten while a usage
      in the same file is not (ADR-010 F-1).
  - path: bot.py
    line: 8
    kind: call
    symbol: google.generativeai.configure
    label: manual
    why: One of two configure calls. The new SDK has no global to configure, so a person
      has to decide whether the two branches build one client or two.
  - path: bot.py
    line: 10
    kind: call
    symbol: google.generativeai.configure
    label: manual
    why: The other one.
  - path: bot.py
    line: 12
    kind: call
    symbol: google.generativeai.GenerativeModel
    label: manual
    why: There is no resolved client to hang it on until the decision above is made.
  - path: bot.py
    line: 16
    kind: method_call
    symbol: google.generativeai.GenerativeModel.generate_content
    label: manual
    why: Same reason.
  manifests:
  - path: requirements.txt
    line: 1
    symbol: google-generativeai
    label: manual
    why: Nothing in the repository migrated, so the pin stays where it is (ADR-010 F-2).
