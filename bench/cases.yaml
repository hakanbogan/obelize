      is a hundred and forty lines and holds the whole shape the `chat_async_self` fixture
      was written for: a `configure` inside `__init__`, two models stored on `self`, and a
      method that picks between them at runtime.'
    files_read:
    - pyproject.toml
    - requirements.txt
    - src/utils/llm_providers/gemini.py
    - tests/test_gemini_provider.py
    - pytest.ini
    call_sites:
    - path: src/utils/llm_providers/gemini.py
      line: 3
      kind: import
      symbol: google.generativeai
      label: auto
