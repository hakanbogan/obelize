        recall cannot be bought by widening the prefilter without taking every `upload_file`
        in Python with it. Pre-registered as a miss.'
    - path: backend/src/deep_evaluation.py
      line: 94
      kind: method_call
      symbol: google.generativeai.GenerativeModel.generate_content
      label: manual
      why: The same shape, in the second consumer module. Also pre-registered.
    manifests: []
    must_not_report:
    - path: backend/src/evaluation.py
      line: 36
      why: '`client.upload_file(image_path)` calls **this project''s** wrapper, not `genai.upload_file`.
        The method name matches a legacy free function exactly and the receiver is a local
        module; reporting it is a false positive. `deep_evaluation.py:88` and the two `client.delete_file`
        calls at `evaluation.py:44` and `deep_evaluation.py:110` are the same trap.'
    - path: backend/src/evaluation.py
      line: 44
      why: '`client.delete_file(...)`, the project''s own wrapper.'
    - path: backend/src/deep_evaluation.py
      line: 88
      why: '`client.upload_file(...)`, the project''s own wrapper.'
    - path: backend/src/deep_evaluation.py
      line: 110
      why: '`client.delete_file(...)`, the project''s own wrapper.'
    - path: backend/bootstrap_dataset.py
