    - path: src/utils/llm_providers/gemini.py
      line: 62
      kind: method_call
      symbol: google.generativeai.GenerativeModel.generate_content
      label: manual
      why: The receiver is a local chosen at runtime between the two models, which carry **different
        model names**. In the new SDK the name is an argument to the call, so a correct migration
        has to replace the object at line 49 with its name -- and line 49 is not a legacy
        call site, so no rule scoped to this one can reach it. The inline `generation_config`
        dict is the easy half and its four keys are all legal.
    manifests:
    - path: pyproject.toml
      line: 24
      symbol: google-generativeai
      label: auto
      why: A Poetry `^0.8.4` caret range in `[tool.poetry.dependencies]`. `requirements.txt`
        does not declare it, so this is the repository's only pin and the only manifest edit.
        This row said line 23 until T30's error analysis, which is the line above it -- the
        `google-cloud-aiplatform` caret range. The scan reported the pin at 24 and the key
        recorded it at 23, so the two never matched and the row was counted as a miss the
        scanner had in fact found. Nothing the round published moves -- the row is unmigrated
        either way, because `repo_not_fully_migrated` withholds it.
