  reviewer: Hakan Bogan
  reviewed_at: '2026-09-21'
  notes: 'The case is worth its key for the manifest as much as for the code: the Vertex distribution
    is declared on the line above the legacy one, which is the closest thing in the corpus
    to the decoy every `manifests/` fixture carries. `poetry.lock` is committed and is **not**
    a manifest the scanner reads; the pin it would need to move is the one in `pyproject.toml`.'
