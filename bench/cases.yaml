        never bound in the enclosing function either. Dead code, and a migration that leaves
        it alone is not wrong.'
    tests_cover_change: false
    tests_cover_change_why: 'The two files the corpus counted as a test suite are `UI/scripts/smoke_test.py`
      and `frontend/scripts/smoke_test.py`: Kivy application smoke scripts that build a window,
      import no test runner and touch none of the Gemini code. This case is the proof that
      the `Tests` column in `bench/CANDIDATES.md` is path evidence and not a judgement.'
  reviewer: Hakan Bogan
  reviewed_at: '2026-09-21'
  notes: 'Three of the fifteen call sites are in files that contain no token the prefilter
    looks for, because the SDK is reached through the project''s own `client` module -- the
    same hole gate 1 pre-registered for `readme-ai/tests/models/test_gemini.py`, met again
    and now three times over in one repository. **No manifest in this repository declares
    the SDK at all**: three `requirements.txt` files, none naming it, so the migration has
    no pin to move and the dependency it needs would have to be added rather than rewritten.'
