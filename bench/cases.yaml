      line: 39
      kind: call
      symbol: google.generativeai.upload_file
      label: manual
      why: '`genai.upload_file(path=...)` becomes `client.files.upload(file=...)`, which is
        mechanical -- but there is no client in this module and the keyword changes name,
        so the edit needs the decision above first.'
    - path: backend/src/client.py
      line: 55
      kind: call
      symbol: google.generativeai.delete_file
      label: manual
      why: Same shape as the upload, and the corpus's only `delete_file`.
    - path: backend/data/gemini_helpers.py
      line: 2
      kind: import
      symbol: google.generativeai
      label: auto
    - path: backend/data/gemini_helpers.py
      line: 15
      kind: call
      symbol: google.generativeai.configure
      label: manual
      why: A second `initialize_gemini`, in a second module, with the same shape. Two modules
        configure the same global.
    - path: backend/data/gemini_helpers.py
      line: 32
      kind: call
      symbol: google.generativeai.list_models
      label: manual
      why: The corpus's only `list_models`. `client.models.list()` is the counterpart and
