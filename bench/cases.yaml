    - path: backend/src/client.py
      line: 2
      kind: import
      symbol: google.generativeai
      label: auto
    - path: backend/src/client.py
      line: 14
      kind: call
      symbol: google.generativeai.configure
      label: manual
      why: '`initialize_gemini()` configures global state and returns nothing; three other
        modules call it and then call a second function for the model. The new SDK has no
        global state, so the client has to become a value that crosses four modules, and nothing
        about that follows from this line.'
    - path: backend/src/client.py
      line: 26
      kind: call
      symbol: google.generativeai.GenerativeModel
      label: manual
      why: Returned to callers in three other modules.
