    - path: backend/data/gemini_helpers.py
      line: 40
      kind: attribute
      symbol: google.generativeai.types.Model.supported_generation_methods
      label: manual
      why: 'Read through `getattr(m, "supported_generation_methods", [])`. The attribute has
        no counterpart in the new SDK, so there is no edit to make: what this function is
        for has to be rethought, which is exactly what a `flag_only` change is for.'
    - path: backend/data/gemini_helpers.py
      line: 78
      kind: call
      symbol: google.generativeai.GenerativeModel
      label: manual
      why: One of three returns from a fallback ladder.
    - path: backend/data/gemini_helpers.py
      line: 98
      kind: call
      symbol: google.generativeai.GenerativeModel
      label: manual
      why: The second return from the fallback ladder, same shape.
    - path: backend/data/gemini_helpers.py
      line: 107
      kind: call
      symbol: google.generativeai.GenerativeModel
      label: manual
      why: The last resort of the same ladder, with a hard-coded model name.
    - path: backend/src/evaluation.py
      line: 41
      kind: method_call
      symbol: google.generativeai.GenerativeModel.generate_content
      label: manual
      why: 'The receiver is a parameter, and **this file contains no token the pack''s prefilter
        looks for**: it reaches the SDK entirely through the project''s own `client` module.
