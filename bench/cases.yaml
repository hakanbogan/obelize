      line: 350
      why: The same decorator.
    - path: tests/test_ai_merge.py
      line: 379
      why: The same decorator.
    tests_cover_change: true
    tests_cover_change_why: '`tests/test_ai_merge.py` exercises `ai_analyze_merge` and `ai_resolve_clarifications`,
      which contain six of the thirteen call sites, and it does it by patching the project''s
      own factory rather than the SDK -- so the migrated code runs under the tests, and a
      migration that changes what `_get_genai_model` returns breaks them. It does not reach
      `ai_resolve_merge`, which holds the other shape.'
  reviewer: Hakan Bogan
  reviewed_at: '2026-09-21'
  notes: 'The two shapes in one module are what makes this case worth its key: the same repository
    holds an eleven-line migration that follows from the code and a factory whose return value
    is a model object, which does not. Nothing in the suite needs a network or an API key
    -- the SDK is never imported under test, because both imports are inside functions the
    tests do not reach with a real key.'
