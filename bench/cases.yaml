      why: Inside `_get_genai_model` and inside a `try/except ImportError`. The statement
        itself rewrites mechanically; the sentence in the `except` branch that tells the user
        to `pip install google-generativeai` does not, and a migration leaves it stale.
    - path: vit/ai_merge.py
      line: 314
      kind: call
      symbol: google.generativeai.configure
      label: manual
      why: The enclosing function returns the model object it builds. The new SDK has no model
