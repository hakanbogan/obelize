#   reviewed  what the reviewer read; mandatory: absent `wrong` means none, not unread (ADR-042 D3).
#   wrong     edits to undo or repair, each naming a file the arm changed and why.
# `patch_correct` = no `wrong` (null if no file changed); corrections = rows left + len(wrong).
# Not `bench/cases.yaml`: the round there is frozen and its `review` blocks stay empty (ADR-045 D4).

