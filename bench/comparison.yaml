  general_agent:

    Arnav3241__Jarvis-v13:
      reviewed: >-
        Nine files. The two `Skills.py` calls, `Chat/PDF_Chat.py`,
        `Chat/response.py`, `Tests/test.py`'s caching surface and the three
        LangChain files, where the arm removed an inert `configure("")` rather
        than building a client that would have raised at import. The safety list
        became `types.SafetySetting` objects with their values intact, including
        `HARM_CATEGORY_DANGEROUS`, which is not a member of the new SDK's
        `HarmCategory` -- the SDK fabricates it with a warning rather than
        refusing, so it survives as a category the API does not know. That one is
        in the tree the arm started from, not something the arm wrote.
      wrong:
        - path: Chat/response.py
          line: 620
          why: >-
            `model.start_chat(history=str(time.time()))` is not a history in
            either SDK -- a float rendered as a string, on a chat session the
            next line discards. The arm translated it into
            `client.chats.create(history=[types.Content(role='user',
            parts=[types.Part(text=str(time.time()))])])`, which invents a user
            turn whose text is a Unix timestamp. The second run of this same case
            deleted the line instead, which is the reading that keeps behaviour.
            This is the row ADR-044 D5 published as the lever that must not be
            taken.

    LucasHJin__vit:
      reviewed: >-
        `setup.py`, `vit/ai_merge.py` and two documentation files. The module
        keeps its `_get_genai_model` seam by returning a new `_GeminiModel`
        adapter that binds the model name and the config once, so the six callers
        and the seven tests that patch that name are untouched. An invented
        abstraction, and the alternative was rewriting the project's test seam;
        the suite runs 100 tests under the new SDK and all of them pass. Accepted
        rather than rejected: it keeps behaviour, which is what was asked.

    RuntimeAI__silly-merchants-for-safe-hackathon:
      reviewed: >-
        `src/utils/llm_providers/gemini.py` and `pyproject.toml`. The two eagerly
        built models became name strings, the generation settings became a
        `GenerateContentConfig` with the same four values, and an explicit raise
        was added where the new SDK returns `None` from `response.text` -- which
        is what keeps the backup-model fallback reachable. `poetry.lock` was left
        alone and said so, which is the right call with no network.

    dongxnb__gupiao:
      reviewed: >-
        Five standalone diagnostic scripts under `tests/`, none of them pytest.
        `genai.list_models()` became `client.models.list()` and
        `supported_generation_methods` became `supported_actions`, guarded with
        `or []` because the new field is optional. No dependency declaration in
        this repository ever named the legacy SDK, so there was no pin to move
        and the arm added none.

    humanbound__humanbound-firewall:
      reviewed: >-
        Five files, and the only case in the split where a suite could contradict
        the patch. It did: 13 passed, 1 failed, against a baseline that passed.
        The arm also rewrote the two test modules the suite is made of, including
        the `FORBIDDEN_MODULES` list of the lazy-import guard, and the failure
        survived that. Everything else in the patch is sound -- the streaming
        call, the config object, and the explicit raise where `response.text`
        went from raising to returning `None`.
      wrong:
        - path: src/humanbound_firewall/llm/gemini.py
          line: 17
          why: >-
            `_import_genai()` exists to turn a missing optional dependency into
            an actionable `ImportError` naming the `[gemini]` extra.
            `import google.generativeai as genai` raises that; `from google
            import genai` does not, because `google` is a namespace package that
            resolves whether or not the member is installed. The helper now
            returns `None` and the user gets `AttributeError: 'NoneType' object
            has no attribute 'Client'`. `tests/test_llm_providers.py::
            test_gemini_missing_dep_raises_actionable` fails on exactly that.

    LotusSerene__Gemini-Novel-Maker:
